<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>方案 C:6 种封面颜色</title>
<link rel="stylesheet" href="mockup.css">
<script src="themes.js"></script>
<script src="seal.js"></script>
<script src="kit.js"></script>
<style>
.grid { display: grid; grid-template-columns: repeat(3, auto); gap: 30px 34px; }
.tile { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.tile > b { font-size: 18px; font-weight: 600; color: #3f3a33; }
.tile > b small { margin-left: 6px; font-size: 13px; font-weight: 400; color: #8a8478; }
.mini { zoom: .62; width: 390px; height: 600px; border-radius: 44px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 0 0 2px rgba(0,0,0,.18), 0 14px 30px rgba(0,0,0,.22); }
</style>
</head>
<body>
<div class="board" style="flex-direction: column; gap: 26px">
  <p class="caption" style="margin: 0">6 种封面颜色放在读稿页上:上下栏是皮面,中间是纸。浅金这类浅色皮面上用深色字。</p>
  <div class="grid" id="grid"></div>
</div>
<script>
const page = pTop({ sub: '第 3 轮回稿', tone: 'back' }) + `<main class="p-body paper-c">${roundCard()}${docClean()}</main>` + pBottom({ line: '稿子回来了', detail: '划词就开始第 4 轮', right: sealBtn() });
document.getElementById('grid').innerHTML = THEMES.map((t) => `<div class="tile"><div class="mini" style="${themeVars(t)}">${page}</div><b>${t.name}<small>${t.from}${t.id === 'mist' ? ' · 默认' : ''}</small></b></div>`).join('');
</script>
</body>
</html>
