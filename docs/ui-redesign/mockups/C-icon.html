<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>方案 C 皮面手账:App 图标</title>
<link rel="stylesheet" href="mockup.css">
<style>
.icon-c { position: relative; width: 1em; height: 1em; border-radius: .2267em; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 20% 30%, rgba(255,255,255,.05) 0 .003em, transparent .006em) 0 0 / .025em .025em,
    radial-gradient(circle at 60% 70%, rgba(0,0,0,.2) 0 .003em, transparent .006em) 0 0 / .03em .03em,
    radial-gradient(ellipse at 35% 25%, #6e2c22 0%, #561f19 55%, #3d130f 100%);
  box-shadow: inset 0 .006em 0 rgba(255,200,170,.25), inset 0 -.02em .04em rgba(0,0,0,.45), 0 .03em .07em rgba(0,0,0,.35); }
.icon-c .st { position: absolute; inset: .055em; border: .007em dashed rgba(240,210,170,.6); border-radius: .18em; }
.seal { width: .6em; height: .6em; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-family: "Kaiti SC", serif; font-weight: 700; font-size: 1em; color: #ffd9cc;
  background: radial-gradient(circle at 40% 35%, #e05544 0%, #b0281d 55%, #84150f 100%);
  box-shadow: inset 0 0 0 .025em rgba(150,25,18,.6), inset 0 0 0 .035em rgba(235,120,105,.35), inset 0 -.015em .025em rgba(0,0,0,.4),
    .016em 0 0 -.004em #b0281d, -.012em .012em 0 -.004em #a2221a, .006em -.016em 0 -.004em #b82e22, -.014em -.008em 0 -.005em #a9251c, 0 .02em .035em rgba(0,0,0,.5); }
.seal span { font-size: .34em; line-height: 1; text-shadow: 0 -.01em 0 rgba(80,0,0,.6), 0 .008em 0 rgba(255,170,150,.35); }
.mac-icon { filter: drop-shadow(0 .03em .05em rgba(0,0,0,.35)); }
.home-row { display: flex; gap: 26px; padding: 22px 26px; border-radius: 22px; background: linear-gradient(160deg, #304a64, #1d2b3c); }
.home-app { display: flex; flex-direction: column; align-items: center; gap: 6px; color: #fff; font-size: 12px; }
.other-app { width: 60px; height: 60px; border-radius: 14px; background: linear-gradient(160deg, #8fa3b8, #5d6f83); opacity: .7; }
</style>
</head>
<body>
<div class="board" style="flex-direction: column; gap: 30px">
  <p class="caption" style="margin: 0">App 图标:缝线皮面上压一枚火漆「回」字印</p>
  <div style="display: flex; gap: 56px; align-items: flex-end">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
      <div class="icon-c" style="font-size: 300px"><i class="st"></i><div class="seal"><span>回</span></div></div>
      <span class="caption" style="margin: 0">iPhone</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
      <div class="icon-c mac-icon" style="font-size: 230px; margin: 20px"><i class="st"></i><div class="seal"><span>回</span></div></div>
      <span class="caption" style="margin: 0">Mac</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 18px">
      <div style="display: flex; gap: 18px; align-items: flex-end">
        <div class="icon-c" style="font-size: 120px"><i class="st"></i><div class="seal"><span>回</span></div></div>
        <div class="icon-c" style="font-size: 76px"><i class="st"></i><div class="seal"><span>回</span></div></div>
        <div class="icon-c" style="font-size: 40px"><i class="st"></i><div class="seal"><span>回</span></div></div>
      </div>
      <div class="home-row">
        <div class="home-app"><div class="other-app"></div>备忘录</div>
        <div class="home-app"><div class="icon-c" style="font-size: 60px"><i class="st"></i><div class="seal"><span>回</span></div></div>回稿</div>
        <div class="home-app"><div class="other-app"></div>文件</div>
      </div>
      <span class="caption" style="margin: 0">小尺寸与主屏幕上的样子</span>
    </div>
  </div>
</div>
</body>
</html>
