<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>方案 C:火漆印去掉圆圈</title>
<link rel="stylesheet" href="mockup.css">
<style>
.row { display: flex; gap: 26px; align-items: flex-end; }
.row .name { width: 64px; align-self: center; font-size: 20px; font-weight: 700; color: #57524a; }
.bar { padding: 10px 16px; border-radius: 8px; display: flex; align-items: center; gap: 8px; }
</style>
<script src="themes.js"></script>
<script src="seal.js"></script>
</head>
<body>
<!-- 第四版的火漆印(带圆圈),只在这一页做对比 -->
<svg width="0" height="0" style="position: absolute" aria-hidden="true"><defs><linearGradient id="wax-rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3907c"/><stop offset=".5" stop-color="#b62d23"/><stop offset="1" stop-color="#6a0f0a"/></linearGradient><g id="wax-hui-l"><rect x="33.8" y="33.8" width="32.4" height="32.4" rx="4.2" fill="none" stroke-width="5.3"/><rect x="44" y="44" width="12" height="12" rx="1.45" fill="none" stroke-width="4.1"/></g><symbol id="seal-old" viewBox="0 0 100 100" overflow="visible"><use href="#wax-blob" fill="#3a0805" opacity=".5" transform="translate(1.6 3.2)" filter="url(#wax-b2)"/><use href="#wax-blob" fill="url(#wax-body)"/><use href="#wax-blob" fill="none" stroke="#4e0a06" stroke-opacity=".45" stroke-width="2.2" filter="url(#wax-b1)"/><circle cx="50" cy="50" r="32.8" fill="none" stroke="url(#wax-rim)" stroke-width="5.6"/><circle cx="50" cy="50" r="30" fill="url(#wax-well)"/><use href="#wax-hui-l" transform="translate(.9 .9)" stroke="#560b07" opacity=".8" filter="url(#wax-b05)"/><use href="#wax-hui-l" transform="translate(-.55 -.55)" stroke="#f39a88" opacity=".9"/><use href="#wax-hui-l" stroke="#c0362a"/><ellipse cx="31" cy="25" rx="13" ry="5" transform="rotate(-38 31 25)" fill="#fff" opacity=".35" filter="url(#wax-b2)"/><ellipse cx="27.5" cy="24" rx="4.2" ry="1.5" transform="rotate(-40 27.5 24)" fill="#fff" opacity=".75" filter="url(#wax-b05)"/></symbol></defs></svg>
<div class="board" id="board" style="flex-direction: column; gap: 22px"></div>
<script>
const row = (id, name, note) => `<div class="row"><span class="name">${name}</span>`
  + [260, 120, 60, 29].map((s) => `<div class="icon-c" style="font-size: ${s}px"><svg><use href="#${id}"/></svg></div>`).join('')
  + `<div class="bar lt-deep"><span class="lt-ink" style="font-size: 13px; font-weight: 600">盖章定稿</span><svg width="62" height="62" style="overflow: visible"><use href="#${id}"/></svg></div>`
  + `<svg width="92" height="92" style="overflow: visible; transform: rotate(-9deg); filter: drop-shadow(0 2px 2px rgba(0,0,0,.2))"><use href="#${id}"/></svg></div>`
  + `<p class="caption" style="margin: 0 0 18px 90px">${note}</p>`;
document.getElementById('board').innerHTML = row('seal-old', '现在', '从里到外:「回」字、一圈圆、蜡边。「回」字在圆圈里面,显得小')
  + row('seal', '改后', '去掉圆圈。「回」字外框就是印的边,框里压下去,蜡从四边挤出来鼓在外面。「回」字放大到原来的约 1.4 倍,小图标上也看得清');
</script>
</body>
</html>
