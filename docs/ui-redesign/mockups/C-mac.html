<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>方案 C Mac:稿子回来了</title>
<link rel="stylesheet" href="mockup.css">
<script src="themes.js"></script>
<script src="seal.js"></script>
<script src="kit.js"></script>
</head>
<body>
<div class="board" id="board" style="flex-direction: column; gap: 0"></div>
<script>
const macSeal = `<span class="lt-ink" style="flex: none; font-size: 14px; font-weight: 600">通过 · 定稿</span>${seal(46)}`;
const gh = (tone, name, n) => `<div class="m-gh"><i class="dot tone-${tone}" style="box-shadow: none"></i><span class="nm">${name}</span><span class="n">${n}</span></div>`;
const win = mac(macTop({ pill: macPill('稿子回来了 · 已是最新版', 'back', 'history'), toggle: 'show', right: macSeal })
  + `<div class="m-work">${macSide({ body: macDocs('产品方案') })}<main class="m-main"><div class="m-paper paper-c">${macDoc('clean')}</div></main>`
  + macRight(macRound(false) + macDash(), '要继续改:直接在正文划词批注,自动开始第 4 轮。') + '</div>');
const confirmBar = `<div class="mac lt-deep" style="height: 60px">${macTop({ pill: macPill('稿子回来了 · 已是最新版', 'back', 'history'),
  confirm: `<span class="lt-ink" style="font-size: 15px; font-weight: 700">确认定稿?</span><span class="lt-ink-soft" style="font-size: 13px">AI 会收到「审阅结束」</span>${tagBtn('取消', { kind: 'plain' })}<span class="lt-ink" style="font-size: 14px; font-weight: 600">盖章</span>${seal(50)}` })}</div>`;
document.getElementById('board').innerHTML = shotW('Mac 窗口·稿子回来了:左边目录页,中间纸面,右边回稿卡默认收起成一行;「显示改动」在工具栏', win)
  + `<div style="height: 36px"></div>` + shotW('点「通过 · 定稿」:工具栏原地变成确认,不从别处弹框。再按一次火漆印才算定稿', confirmBar);
</script>
</body>
</html>
