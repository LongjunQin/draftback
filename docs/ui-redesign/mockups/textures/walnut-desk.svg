<svg xmlns="http://www.w3.org/2000/svg" width="800" height="900" viewBox="0 0 800 900">
  <!-- 胡桃木桌面:比木条更深,木纹横向、不规则,低对比 -->
  <filter id="w" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.0014 0.004" numOctaves="2" seed="8" result="warp"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.001 0.06" numOctaves="4" seed="17" result="grain"/>
    <feDisplacementMap in="grain" in2="warp" scale="50" xChannelSelector="G" yChannelSelector="R" result="g0"/>
    <feGaussianBlur in="g0" stdDeviation="1.6 .4" result="g"/>
    <feComponentTransfer in="g" result="gc"><feFuncR type="linear" slope="1.5" intercept="-.25"/></feComponentTransfer>
    <feColorMatrix in="gc" type="matrix" values=".22 0 0 0 .19  .145 0 0 0 .11  .09 0 0 0 .065  0 0 0 0 1" result="wood"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.05 0.9" numOctaves="2" seed="29" result="pn"/>
    <feColorMatrix in="pn" type="matrix" values="0 0 0 0 .12  0 0 0 0 .07  0 0 0 0 .04  -5 0 0 0 1.62" result="pores"/>
    <feMerge><feMergeNode in="wood"/><feMergeNode in="pores"/></feMerge>
  </filter>
  <rect width="800" height="900" filter="url(#w)"/>
</svg>
