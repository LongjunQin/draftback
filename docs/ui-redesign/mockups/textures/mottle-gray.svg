<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900">
  <!-- 皮面大块的轻微深浅:中灰为平面,用 soft-light 叠在皮色上;只改明暗、不带颜色,任何皮色都能用 -->
  <filter id="f" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="3" seed="21" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values=".3 0 0 0 .35  .3 0 0 0 .35  .3 0 0 0 .35  0 0 0 0 1"/>
  </filter>
  <rect width="900" height="900" filter="url(#f)"/>
</svg>
