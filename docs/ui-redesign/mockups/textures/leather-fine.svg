<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- 软皮细纹(第二版,2026-10-17 用户要「更细腻」):更细、更淡的颗粒;灰度光照图,中灰为平面,用 soft-light 叠在皮色上 -->
  <filter id="l" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="5" stitchTiles="stitch" result="n"/>
    <feDiffuseLighting in="n" surfaceScale="0.8" diffuseConstant="1" lighting-color="#ffffff" result="lit">
      <feDistantLight azimuth="235" elevation="60"/>
    </feDiffuseLighting>
    <feComponentTransfer in="lit">
      <feFuncR type="linear" slope=".5" intercept=".25"/>
      <feFuncG type="linear" slope=".5" intercept=".25"/>
      <feFuncB type="linear" slope=".5" intercept=".25"/>
    </feComponentTransfer>
  </filter>
  <rect width="240" height="240" filter="url(#l)"/>
</svg>
