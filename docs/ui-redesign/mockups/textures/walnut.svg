<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="160" viewBox="0 0 1400 160">
  <!-- 胡桃木:顺着木条方向(横向)的不规则木纹 + 细小棕眼,低对比 -->
  <filter id="w" x="-5%" y="-25%" width="110%" height="150%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.0016 0.006" numOctaves="2" seed="4" result="warp"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.0012 0.08" numOctaves="4" seed="11" result="grain"/>
    <feDisplacementMap in="grain" in2="warp" scale="40" xChannelSelector="G" yChannelSelector="R" result="g0"/>
    <feGaussianBlur in="g0" stdDeviation="1.4 .35" result="g"/>
    <feComponentTransfer in="g" result="gc"><feFuncR type="linear" slope="1.6" intercept="-.3"/></feComponentTransfer>
    <feColorMatrix in="gc" type="matrix" values=".28 0 0 0 .25  .19 0 0 0 .145  .12 0 0 0 .085  0 0 0 0 1" result="wood"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.05 0.9" numOctaves="2" seed="23" result="pn"/>
    <feColorMatrix in="pn" type="matrix" values="0 0 0 0 .18  0 0 0 0 .10  0 0 0 0 .06  -5 0 0 0 1.65" result="pores"/>
    <feMerge><feMergeNode in="wood"/><feMergeNode in="pores"/></feMerge>
  </filter>
  <rect width="1400" height="160" filter="url(#w)"/>
</svg>
