<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>方案 A 纸与胡桃木:App 图标</title>
<link rel="stylesheet" href="mockup.css">
<style>
/* 图标用 em 作单位:外层 font-size 就是图标边长,小尺寸照样按比例缩 */
.icon-a { position: relative; width: 1em; height: 1em; border-radius: .2267em; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at 30% 18%, rgba(255,226,190,.22), rgba(255,226,190,0) 60%), linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,.25)),
    url(textures/walnut-desk.svg) -.4em -.9em / 2.667em 3em, #4e2f1c;
  box-shadow: inset 0 .006em 0 rgba(255,220,180,.4), inset 0 -.02em .04em rgba(0,0,0,.45), 0 .03em .07em rgba(0,0,0,.35); }
.ia-b1, .ia-b2 { display: flex; align-items: center; justify-content: center; border: .004em solid #6e4b18;
  background: linear-gradient(160deg, #fbe6b0 0%, #e0b462 40%, #b8863a 70%, #8c6224 100%);
  box-shadow: inset 0 .006em 0 rgba(255,255,255,.85), inset 0 -.012em .012em rgba(90,55,15,.55), 0 .012em .02em rgba(0,0,0,.6); }
.ia-b1 { width: .58em; height: .58em; border-radius: .045em; }
.ia-c1 { width: .4em; height: .4em; border-radius: .02em; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at 40% 30%, #5d381f, #3c2213); box-shadow: inset 0 .014em .025em rgba(0,0,0,.7), inset 0 -.004em 0 rgba(255,220,180,.15); }
.ia-b2 { width: .2em; height: .2em; border-radius: .02em; }
.ia-c2 { width: .07em; height: .07em; border-radius: .008em; background: #3c2213; box-shadow: inset 0 .008em .012em rgba(0,0,0,.75); }
.mac-icon { filter: drop-shadow(0 .03em .05em rgba(0,0,0,.35)); }
.home-row { display: flex; gap: 26px; padding: 22px 26px; border-radius: 22px; background: linear-gradient(160deg, #304a64, #1d2b3c); }
.home-app { display: flex; flex-direction: column; align-items: center; gap: 6px; color: #fff; font-size: 12px; }
.other-app { width: 60px; height: 60px; border-radius: 14px; background: linear-gradient(160deg, #8fa3b8, #5d6f83); opacity: .7; }
</style>
</head>
<body>
<div class="board" style="flex-direction: column; gap: 30px">
  <p class="caption" style="margin: 0">App 图标:胡桃木上嵌黄铜「回」字</p>
  <div style="display: flex; gap: 56px; align-items: flex-end">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
      <div class="icon-a" style="font-size: 300px"><div class="ia-b1"><div class="ia-c1"><div class="ia-b2"><div class="ia-c2"></div></div></div></div></div>
      <span class="caption" style="margin: 0">iPhone</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
      <div class="icon-a mac-icon" style="font-size: 230px; margin: 20px"><div class="ia-b1"><div class="ia-c1"><div class="ia-b2"><div class="ia-c2"></div></div></div></div></div>
      <span class="caption" style="margin: 0">Mac</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 18px">
      <div style="display: flex; gap: 18px; align-items: flex-end">
        <div class="icon-a" style="font-size: 120px"><div class="ia-b1"><div class="ia-c1"><div class="ia-b2"><div class="ia-c2"></div></div></div></div></div>
        <div class="icon-a" style="font-size: 76px"><div class="ia-b1"><div class="ia-c1"><div class="ia-b2"><div class="ia-c2"></div></div></div></div></div>
        <div class="icon-a" style="font-size: 40px"><div class="ia-b1"><div class="ia-c1"><div class="ia-b2"><div class="ia-c2"></div></div></div></div></div>
      </div>
      <div class="home-row">
        <div class="home-app"><div class="other-app"></div>备忘录</div>
        <div class="home-app"><div class="icon-a" style="font-size: 60px"><div class="ia-b1"><div class="ia-c1"><div class="ia-b2"><div class="ia-c2"></div></div></div></div></div>回稿</div>
        <div class="home-app"><div class="other-app"></div>文件</div>
      </div>
      <span class="caption" style="margin: 0">小尺寸与主屏幕上的样子</span>
    </div>
  </div>
</div>
</body>
</html>
