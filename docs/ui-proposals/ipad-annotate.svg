<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="820" viewBox="0 0 1180 820" role="img" aria-label="回稿 iPad:用笔划过即批注,右栏是批注">
<title>回稿 iPad:用笔划过即批注,右栏是批注</title>
<style>text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;text-spacing-trim:space-all}.m{font-family:ui-monospace,"SF Mono",Menlo,monospace}</style>
<defs><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B1220" flood-opacity="0.16"/></filter><filter id="sh2" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1.1" flood-color="#0B1220" flood-opacity="0.14"/></filter></defs>
<rect x="0" y="0" width="1180" height="820" fill="#FFFDF8"/><rect x="0" y="0" width="860" height="74" fill="#F9F9F9"/><line x1="0" y1="74" x2="860" y2="74" stroke="#E5E5EA" stroke-width="1"/><text x="24" y="50" font-size="17" font-weight="700" fill="#000000">发布说明.md</text><circle cx="136.1" cy="44" r="4" fill="#0D8077"/><text x="146.1" y="49" font-size="13" font-weight="600" fill="#0A665E">第 3 轮 · 可批注</text><rect x="729.5" y="30" width="112.5" height="34" rx="10" fill="#0D8077"/><g transform="translate(741 40) scale(0.875)" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.6l1.6 4.8 4.8 1.6-4.8 1.6L8 14.4l-1.6-4.8L1.6 8l4.8-1.6z"/></g><text x="760" y="52.4" font-size="15" font-weight="600" fill="#FFFFFF">交给 AI · 3</text><rect x="679.5" y="32" width="34" height="32" rx="8" fill="#E2F3F0"/><g transform="translate(684.5 36) scale(1.5)" fill="none" stroke="#0A665E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M10 2.5v11"/></g><g transform="translate(638.5 36) scale(1.5)" fill="none" stroke="#0D8077" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.8v8.4M5.2 4.4L8 1.8l2.8 2.6"/><path d="M5 7H3.6v7h8.8V7H11"/></g><g transform="translate(592.5 36) scale(1.5)" fill="none" stroke="#0D8077" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h8M6 8h8M6 12h8M2.5 4h.1M2.5 8h.1M2.5 12h.1"/></g><text x="110" y="128" font-size="26" font-weight="700" fill="#101827">这次更新了什么</text><rect x="298.5" y="155.4" width="155" height="25.8" rx="3" fill="#FCE1B0"/><text x="110" y="174" font-size="19" fill="#172033">手机端改了三处地方。首页按轮到谁分组，打开就知道哪篇该你看，不用一</text><text x="110" y="208" font-size="19" fill="#172033">篇篇点进去。</text><text x="110" y="306" font-size="19" fill="#172033">在 iPad 上，用笔从一行字上划过去，就等于选中了这一段；手机上则是选中</text><text x="110" y="340" font-size="19" fill="#172033">文字后，底部直接出现「批注这段」按钮，拇指就能点到。</text><path d="M212 302 C 276 297, 326 305, 412 299" fill="none" stroke="#F59A23" stroke-width="24" opacity="0.38" stroke-linecap="round"/><g transform="translate(410 298) rotate(-32) scale(0.82)"><path d="M0 0l16 -6h150a8 8 0 0 1 8 8v0a8 8 0 0 1-8 8H16z" fill="#F4F5F7" stroke="#D4D9E1" stroke-width="1.2"/><path d="M0 0l16-6v14z" fill="#5A606B"/><rect x="128" y="-6" width="8" height="16" fill="#D4D9E1" opacity=".6"/></g><rect x="336.5" y="371.4" width="60" height="25.8" rx="3" fill="#FCE1B0"/><text x="110" y="390" font-size="19" fill="#172033">回稿时，正文上方先给一张回稿卡：改了什么、采纳了几条、没采纳的为什</text><text x="110" y="424" font-size="19" fill="#172033">么，一眼看完。</text><text x="110" y="488" font-size="26" font-weight="700" fill="#101827">为什么这样改</text><text x="110" y="534" font-size="19" fill="#172033">手机上最常做的事只有三件：看稿、批注、交给 AI。顶部只放看的东西，底</text><text x="110" y="568" font-size="19" fill="#172033">部只放做的事。</text><rect x="768" y="158.5" width="22" height="20" rx="10" fill="#F59A23"/><text x="779" y="172.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><rect x="768" y="374.5" width="22" height="20" rx="10" fill="#F59A23"/><text x="779" y="388.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><rect x="256" y="370" width="360" height="214" rx="14" fill="#FFFFFF" filter="url(#sh)"/><path d="M296 370l10 -10 10 10z" fill="#FFFFFF"/><text x="274" y="402" font-size="17" font-weight="700" fill="#000000">写批注</text><text x="598" y="402" font-size="17" font-weight="600" fill="#0D8077" text-anchor="end">保存</text><text x="546" y="402" font-size="17" fill="#0D8077" text-anchor="end">取消</text><rect x="274" y="416" width="3" height="18" rx="1.5" fill="#F59A23"/><text x="284" y="430" font-size="13" fill="#6D6D72">用笔从一行字上划过去</text><rect x="274" y="446" width="324" height="104" rx="10" fill="#F6F7F9" stroke="#E5E5EA"/><text x="286" y="474" font-size="16" fill="#000000">这里写清楚：笔划过就选中，</text><text x="286" y="498" font-size="16" fill="#000000">不需要再按一下</text><path d="M416.02 520 c 6 -12 12 8 18 -4 s 10 -10 16 2 s 8 8 14 -6 s 12 10 18 -2 s 10 -6 16 4" fill="none" stroke="#6D6D72" stroke-width="2" opacity="0.75" stroke-linecap="round"/><text x="286" y="536" font-size="12" fill="#8E8E93">手写会自动变成文字</text><rect x="860" y="0" width="320" height="820" fill="#F2F2F7"/><line x1="860" y1="0" x2="860" y2="820" stroke="#E5E5EA" stroke-width="1"/><text x="880" y="108" font-size="28" font-weight="700" fill="#000000">批注</text><text x="952" y="108" font-size="20" font-weight="600" fill="#6D6D72">3</text><rect x="876" y="124" width="288" height="40" rx="10" fill="#FFFFFF" stroke="#0D8077" stroke-opacity="0.55" stroke-dasharray="4 3"/><g transform="translate(890 136) scale(1)" fill="none" stroke="#0A665E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2.2h10v8.4L9.6 14H3z"/><path d="M9.6 14v-3.4H13M5.4 5.6h5.2M5.4 8.2h3.4"/></g><text x="914" y="150" font-size="15" font-weight="600" fill="#0A665E">写总体意见</text><rect x="876" y="180" width="288" height="92" rx="10" fill="#FFFFFF" stroke="#E3E6EB" stroke-width="1"/><rect x="890" y="195" width="3" height="16" rx="1.5" fill="#F59A23"/><text x="900" y="207.5" font-size="12" fill="#43526B">首页按轮到谁分组</text><text x="890" y="234" font-size="13.5" fill="#101827">分组标题要不要加数量？</text><text x="890" y="258" font-size="11" fill="#697386">刚刚 · 用笔</text><rect x="876" y="284" width="288" height="92" rx="10" fill="#FFFFFF" stroke="#E3E6EB" stroke-width="1"/><rect x="890" y="299" width="3" height="16" rx="1.5" fill="#F59A23"/><text x="900" y="311.5" font-size="12" fill="#43526B">回稿卡</text><text x="890" y="338" font-size="13.5" fill="#101827">回稿卡默认展开还是收起？</text><text x="890" y="362" font-size="11" fill="#697386">3 分钟前</text><rect x="876" y="388" width="288" height="92" rx="10" fill="#FFFFFF" stroke="#E3E6EB" stroke-width="1"/><rect x="890" y="402" width="58" height="18" rx="9" fill="#FFF4DD"/><text x="919" y="415" font-size="11" font-weight="600" fill="#9A5B00" text-anchor="middle">总体意见</text><text x="890" y="442" font-size="13.5" fill="#101827">整体再短一点，一屏能看完最好。</text><text x="890" y="466" font-size="11" fill="#697386">全篇 · 5 分钟前</text><text x="880" y="790" font-size="13" fill="#8E8E93">外接键盘：⌥⌘M 批注 · ⌘↩ 交给 AI</text><text x="24" y="18" font-size="14" font-weight="600" fill="#000000">9:41</text><text x="66" y="18" font-size="14" font-weight="600" fill="#000000">10月14日 周二</text><path d="M1102 11a8 8 0 0 1 10.5 0M1104.3 13.8a4.6 4.6 0 0 1 6 0" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round"/><circle cx="1107.3" cy="16.6" r="1.4" fill="#000000"/><text x="1122" y="18" font-size="12" font-weight="600" fill="#000000">86%</text><rect x="1146" y="8" width="24" height="11.5" rx="3.5" fill="none" stroke="#000000" stroke-width="1" stroke-opacity="0.45"/><rect x="1148" y="10" width="17" height="7.5" rx="2" fill="#000000"/><rect x="433" y="806" width="314" height="5" rx="2.5" fill="#000000" opacity="0.85"/>
</svg>
