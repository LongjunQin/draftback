<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="回稿 Mac 深色:阅读与批注">
<title>回稿 Mac 深色:阅读与批注</title>
<style>text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;text-spacing-trim:space-all}.m{font-family:ui-monospace,"SF Mono",Menlo,monospace}</style>
<defs><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B1220" flood-opacity="0.55"/></filter><filter id="sh2" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1.1" flood-color="#0B1220" flood-opacity="0.45"/></filter></defs>
<rect x="0" y="0" width="1440" height="900" fill="#1B1D22"/><rect x="240" y="52" width="880" height="848" fill="#1F2126"/><text x="320" y="118" font-size="29" font-weight="750" fill="#F3F4F7">跨端规则</text><rect x="452" y="97" width="84.6" height="22" rx="11" fill="#3D2F14"/><text x="494.3" y="112.3" font-size="12" font-weight="600" fill="#F2B45A" text-anchor="middle">1 条总体意见</text><rect x="320" y="148" width="720" height="44" fill="#1B2A28"/><rect x="320" y="148" width="3" height="44" fill="#3F8F85"/><text x="336" y="176" font-size="15" fill="#C4CAD4">人话：用苹果自家的 iCloud 当邮筒，Mac 把文档投进去，手机去取；手机把批注投进去，Mac 去取。</text><text x="320" y="236" font-size="23" font-weight="700" fill="#F3F4F7">7. 手机上的状态链</text><text x="320" y="274" font-size="16" fill="#E4E7EC">人话：每一步你都能看到批注走到哪了，「已上传」不会被说成「正在改稿」。</text><rect x="320" y="294" width="720" height="170" rx="6" fill="#23262D" stroke="#454B57"/><path d="M326 294.5h708a5.5 5.5 0 0 1 5.5 5.5v28h-719v-28a5.5 5.5 0 0 1 5.5-5.5z" fill="#2C3038"/><line x1="320" y1="328" x2="1040" y2="328" stroke="#363B45" stroke-width="1"/><line x1="320" y1="362" x2="1040" y2="362" stroke="#363B45" stroke-width="1"/><line x1="320" y1="396" x2="1040" y2="396" stroke="#363B45" stroke-width="1"/><line x1="320" y1="430" x2="1040" y2="430" stroke="#363B45" stroke-width="1"/><line x1="470" y1="294" x2="470" y2="464" stroke="#363B45" stroke-width="1"/><line x1="800" y1="294" x2="800" y2="464" stroke="#363B45" stroke-width="1"/><text x="332" y="316" font-size="14" font-weight="600" fill="#F3F4F7">显示</text><text x="482" y="316" font-size="14" font-weight="600" fill="#F3F4F7">含义</text><text x="812" y="316" font-size="14" font-weight="600" fill="#F3F4F7">触发</text><text x="332" y="350" font-size="14" fill="#E4E7EC">本地已保存</text><text x="482" y="350" font-size="14" fill="#E4E7EC">批注在手机里了</text><text x="812" y="350" font-size="14" fill="#E4E7EC">每条批注落盘</text><text x="332" y="384" font-size="14" fill="#E4E7EC">等待同步</text><text x="482" y="384" font-size="14" fill="#E4E7EC">批次已打包，正在上传或等网络</text><text x="812" y="384" font-size="14" fill="#E4E7EC">点完成本轮</text><text x="332" y="418" font-size="14" fill="#E4E7EC">Mac 已接收</text><text x="482" y="418" font-size="14" fill="#E4E7EC">收到 Mac 的回执，批注已进旁注文件</text><text x="812" y="418" font-size="14" fill="#E4E7EC">回执到达</text><text x="332" y="452" font-size="14" fill="#E4E7EC">修改中</text><text x="482" y="452" font-size="14" fill="#E4E7EC">AI 正在改稿</text><text x="812" y="452" font-size="14" fill="#E4E7EC">Mac 状态同步</text><rect x="510.5" y="484.3" width="147" height="21.8" rx="3" fill="#8A6423"/><rect x="366.5" y="513.3" width="115" height="21.8" rx="3" fill="#5C4521"/><text x="320" y="500" font-size="16" fill="#E4E7EC">状态只能由对应事件推进，界面不得凭猜测前进。默认假设 Mac 常开联网，手机随时可以交出批注；</text><text x="320" y="529" font-size="16" fill="#E4E7EC">联网但长时间没有回执时，显示「等待 Mac 在线」，并提供「重新发送」。</text><text x="320" y="602" font-size="23" font-weight="700" fill="#F3F4F7">8. 三个独立的状态维度</text><text x="320" y="640" font-size="16" fill="#E4E7EC">不用一组界面状态替换现有审阅状态机。三个维度各自存、各自显示：</text><text x="324" y="671" font-size="16" fill="#9AA3B2">1.</text><text x="346" y="671" font-size="16" fill="#E4E7EC">界面模式：阅读或编辑，只影响界面，不影响会话。</text><text x="324" y="700" font-size="16" fill="#9AA3B2">2.</text><text x="346" y="700" font-size="16" fill="#E4E7EC">审阅生命周期与当前写入者：沿用现有状态机。</text><text x="324" y="729" font-size="16" fill="#9AA3B2">3.</text><text x="346" y="729" font-size="16" fill="#E4E7EC">同步状态：按会话记录推送、批次与回执。</text><text x="320" y="776" font-size="16" fill="#E4E7EC">现有的写入检查、版本校验、幂等、备份、原子写入、外部变化检测全部保留。</text><text x="320" y="805" font-size="16" fill="#E4E7EC">冻结审阅期间不能直接覆盖被批注版本；要改，只能另存副本。</text><rect x="1062" y="484.5" width="22" height="20" rx="10" fill="#F0A43A"/><text x="1073" y="498.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><rect x="1062" y="513.5" width="22" height="20" rx="10" fill="#F0A43A"/><text x="1073" y="527.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><rect x="0" y="0" width="240" height="900" fill="#202329"/><line x1="239.5" y1="0" x2="239.5" y2="900" stroke="#363B45" stroke-width="1"/><circle cx="20" cy="26" r="6" fill="#FF5F57"/><circle cx="40" cy="26" r="6" fill="#FEBC2E"/><circle cx="60" cy="26" r="6" fill="#28C840"/><g transform="translate(204 18) scale(1)" fill="none" stroke="#9AA3B2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M6 2.5v11"/></g><rect x="16" y="62" width="208" height="26" rx="7" fill="#30343C"/><text x="69" y="79.3" font-size="12" font-weight="500" fill="#9AA3B2" text-anchor="middle">稿件</text><rect x="120" y="64" width="102" height="22" rx="5.5" fill="#4A505B" filter="url(#sh2)"/><text x="171" y="79.3" font-size="12" font-weight="600" fill="#F3F4F7" text-anchor="middle">大纲</text><g transform="translate(16 866) scale(0.938)" fill="none" stroke="#9AA3B2" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.6 12.6h6.9a3 3 0 0 0 .3-6 4 4 0 0 0-7.6.9 2.6 2.6 0 0 0 .4 5.1z"/><path d="M6.4 9.4l1.3 1.3 2.4-2.4"/></g><text x="36" y="878" font-size="11" fill="#9AA3B2">iCloud 已同步 · 刚刚</text><text x="20" y="120.5" font-size="13" font-weight="600" fill="#F3F4F7">跨端规则</text><rect x="203" y="109" width="22" height="15" rx="7.5" fill="#3D2F14"/><text x="214" y="120" font-size="10.5" font-weight="700" fill="#F2B45A" text-anchor="middle">1</text><text x="34" y="150.5" font-size="13" font-weight="400" fill="#C4CAD4">1. 几个词</text><text x="34" y="180.5" font-size="13" font-weight="400" fill="#C4CAD4">2. 两种流程，分开管</text><text x="34" y="210.5" font-size="13" font-weight="400" fill="#C4CAD4">3. 怎么认出是同一份</text><text x="34" y="240.5" font-size="13" font-weight="400" fill="#C4CAD4">4. 谁说了算</text><text x="34" y="270.5" font-size="13" font-weight="400" fill="#C4CAD4">5. 快照包里有什么</text><text x="34" y="300.5" font-size="13" font-weight="400" fill="#C4CAD4">6. 批注怎么走</text><rect x="8" y="312" width="224" height="28" rx="6" fill="#163632"/><text x="34" y="330.5" font-size="13" font-weight="600" fill="#8FE0D4">7. 手机上的状态链</text><rect x="203" y="319" width="22" height="15" rx="7.5" fill="#3D2F14"/><text x="214" y="330" font-size="10.5" font-weight="700" fill="#F2B45A" text-anchor="middle">2</text><text x="34" y="360.5" font-size="13" font-weight="400" fill="#C4CAD4">8. 三个独立的状态维度</text><text x="34" y="390.5" font-size="13" font-weight="400" fill="#C4CAD4">9. 真实数据保护</text><text x="34" y="420.5" font-size="13" font-weight="400" fill="#C4CAD4">10. 首版明确不做</text><text x="34" y="450.5" font-size="13" font-weight="400" fill="#C4CAD4">11. 验收场景</text><text x="34" y="480.5" font-size="13" font-weight="400" fill="#C4CAD4">12. 同步通道</text><rect x="240" y="0" width="1200" height="52" fill="#23262C"/><line x1="240" y1="51.5" x2="1440" y2="51.5" stroke="#363B45" stroke-width="1"/><g transform="translate(258 18) scale(1)" fill="none" stroke="#9AA3B2" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 1.8h5.2L12.4 5v9.2H4z"/><path d="M9 1.8V5h3.4"/></g><text x="280" y="31" font-size="13" font-weight="600" fill="#F3F4F7">跨端规则.md</text><g transform="translate(356.5 20) scale(0.75)" fill="none" stroke="#7C8594" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6.2L8 9.8l3.5-3.6"/></g><rect x="1320.9" y="12" width="103.1" height="28" rx="6" fill="#3FC1B2"/><g transform="translate(1332.4 19) scale(0.875)" fill="none" stroke="#062A26" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.6l1.6 4.8 4.8 1.6-4.8 1.6L8 14.4l-1.6-4.8L1.6 8l4.8-1.6z"/></g><text x="1351.4" y="30.7" font-size="13" font-weight="600" fill="#062A26">交给 AI · 3</text><g transform="translate(1290.9 18) scale(1)" fill="none" stroke="#9AA3B2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M10 2.5v11"/></g><rect x="1182.9" y="14" width="92" height="24" rx="7" fill="#30343C"/><rect x="1184.9" y="16" width="44" height="20" rx="5.5" fill="#4A505B" filter="url(#sh2)"/><text x="1206.9" y="30.3" font-size="12" font-weight="600" fill="#F3F4F7" text-anchor="middle">阅读</text><text x="1250.9" y="30.3" font-size="12" font-weight="500" fill="#9AA3B2" text-anchor="middle">编辑</text><g transform="translate(1150.9 18) scale(1)" fill="none" stroke="#9AA3B2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.8v8.4M5.2 4.4L8 1.8l2.8 2.6"/><path d="M5 7H3.6v7h8.8V7H11"/></g><g transform="translate(1120.9 18) scale(1)" fill="none" stroke="#9AA3B2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="4.6"/><path d="M10.5 10.5L14 14"/></g><rect x="701.3" y="13" width="197.5" height="26" rx="13" fill="#163632" stroke="#3FC1B2" stroke-width="1" stroke-opacity="0.38"/><g transform="translate(713.3 19) scale(0.875)" fill="none" stroke="#8FE0D4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10.8 2.7l2.5 2.5L6 12.5l-3.3.8.8-3.3z"/></g><text x="733.3" y="30.5" font-size="12.5" font-weight="600" fill="#8FE0D4">第 2 轮 · 可批注 · 3 条未交</text><rect x="1120" y="52" width="320" height="848" fill="#24272E"/><line x1="1120.5" y1="52" x2="1120.5" y2="900" stroke="#363B45" stroke-width="1"/><text x="1140" y="86" font-size="15" font-weight="700" fill="#F3F4F7">批注</text><text x="1178" y="86" font-size="13" font-weight="600" fill="#9AA3B2">3</text><rect x="1332" y="69" width="92" height="24" rx="7" fill="#30343C"/><rect x="1334" y="71" width="44" height="20" rx="5.5" fill="#4A505B" filter="url(#sh2)"/><text x="1356" y="85.3" font-size="12" font-weight="600" fill="#F3F4F7" text-anchor="middle">本轮</text><text x="1400" y="85.3" font-size="12" font-weight="500" fill="#9AA3B2" text-anchor="middle">历史</text><rect x="1136" y="108" width="288" height="38" rx="8" fill="#24272E" stroke="#3FC1B2" stroke-opacity="0.55" stroke-dasharray="4 3"/><g transform="translate(1150 119) scale(1)" fill="none" stroke="#8FE0D4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2.2h10v8.4L9.6 14H3z"/><path d="M9.6 14v-3.4H13M5.4 5.6h5.2M5.4 8.2h3.4"/></g><text x="1174" y="132" font-size="13" font-weight="600" fill="#8FE0D4">写总体意见</text><text x="1410" y="132" font-size="11" fill="#9AA3B2" text-anchor="end">针对全篇</text><text x="1140" y="176" font-size="11" font-weight="600" fill="#9AA3B2">未交 · 3</text><text x="1420" y="176" font-size="11" fill="#7C8594" text-anchor="end">交出前都能改、能删</text><rect x="1136" y="188" width="288" height="92" rx="10" fill="#3D2F14" stroke="#F0A43A" stroke-width="1.5"/><rect x="1150" y="203" width="3" height="16" rx="1.5" fill="#F0A43A"/><text x="1160" y="215.5" font-size="12" fill="#C4CAD4">界面不得凭猜测前进</text><text x="1150" y="242" font-size="13.5" fill="#F3F4F7">加一个例子：什么情况算凭猜测前进？</text><text x="1150" y="266" font-size="11" fill="#9AA3B2">第 7 节 · 2 分钟前</text><text x="1410" y="266" font-size="11" font-weight="600" fill="#8FE0D4" text-anchor="end">修改   删除</text><rect x="1136" y="292" width="288" height="92" rx="10" fill="#24272E" stroke="#363B45" stroke-width="1"/><rect x="1150" y="307" width="3" height="16" rx="1.5" fill="#F0A43A"/><text x="1160" y="319.5" font-size="12" fill="#C4CAD4">长时间没有回执</text><text x="1150" y="346" font-size="13.5" fill="#F3F4F7">多久算长时间？写个具体的分钟数。</text><text x="1150" y="370" font-size="11" fill="#9AA3B2">第 7 节 · 刚刚</text><rect x="1136" y="396" width="288" height="92" rx="10" fill="#24272E" stroke="#363B45" stroke-width="1"/><rect x="1150" y="410" width="58" height="18" rx="9" fill="#3D2F14"/><text x="1179" y="423" font-size="11" font-weight="600" fill="#F2B45A" text-anchor="middle">总体意见</text><text x="1150" y="450" font-size="13.5" fill="#F3F4F7">第八节和第十二节有重复，能合并吗？</text><text x="1150" y="474" font-size="11" fill="#9AA3B2">全篇 · 5 分钟前</text><line x1="1120" y1="846" x2="1440" y2="846" stroke="#363B45" stroke-width="1"/><text x="1140" y="878" font-size="11" fill="#9AA3B2">⌥⌘M 批注 · ⌘↩ 交给 AI · ⌥⌘↓ 下一条批注</text>
</svg>
