27.5a10 10 0 0 1 13 0M321.6 30.4a6 6 0 0 1 7.8 0" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/><circle cx="325.5" cy="33" r="1.7" fill="#000000"/><rect x="339" y="24" width="25" height="12.5" rx="3.8" fill="none" stroke="#000000" stroke-width="1" stroke-opacity="0.45"/><rect x="341" y="26" width="19" height="8.5" rx="2" fill="#000000"/><rect x="365.5" y="28.2" width="1.6" height="4.2" rx="0.8" fill="#000000" opacity="0.45"/><text x="18" y="146" font-size="22" font-weight="700" fill="#101827">这次更新了什么</text><rect x="186.5" y="169.3" width="139" height="23.1" rx="3" fill="#FCE1B0"/><text x="18" y="186" font-size="17" fill="#172033">手机端改了三处地方。首页按轮到谁分组，打开</text><text x="18" y="216" font-size="17" fill="#172033">就知道哪篇该你看，不用一篇篇点进去。</text><rect x="16.5" y="285.3" width="105" height="23.1" rx="3" fill="#CFE3FF"/><text x="18" y="302" font-size="17" fill="#172033">拇指就能点到：选中文字以后，底部直接出现</text><text x="18" y="332" font-size="17" fill="#172033">「批注这段」按钮，不用去够顶上的小菜单。</text><rect x="16.5" y="285" width="2" height="23" fill="#007AFF"/><circle cx="17.5" cy="283" r="4.5" fill="#007AFF"/><rect x="119.5" y="285" width="2" height="23" fill="#007AFF"/><circle cx="120.5" cy="310" r="4.5" fill="#007AFF"/><rect x="10" y="230" width="248.7" height="40" rx="10" fill="#FFFFFF" filter="url(#sh)"/><path d="M61 270l8 8 8-8z" fill="#FFFFFF"/><text x="37" y="256" font-size="15" font-weight="700" fill="#9A5B00" text-anchor="middle">批注</text><text x="91" y="256" font-size="15" font-weight="400" fill="#000000" text-anchor="middle">拷贝</text><line x1="64" y1="238" x2="64" y2="262" stroke="#E5E5EA" stroke-width="1"/><text x="145" y="256" font-size="15" font-weight="400" fill="#000000" text-anchor="middle">查询</text><line x1="118" y1="238" x2="118" y2="262" stroke="#E5E5EA" stroke-width="1"/><text x="199" y="256" font-size="15" font-weight="400" fill="#000000" text-anchor="middle">翻译</text><line x1="172" y1="238" x2="172" y2="262" stroke="#E5E5EA" stroke-width="1"/><text x="242.4" y="256" font-size="15" font-weight="400" fill="#000000" text-anchor="middle">›</text><line x1="226" y1="238" x2="226" y2="262" stroke="#E5E5EA" stroke-width="1"/><text x="18" y="376" font-size="17" fill="#172033">回稿时，正文上方先给一张回稿卡：改了什么、</text><text x="18" y="406" font-size="17" fill="#172033">采纳了几条、没采纳的为什么，一眼看完。</text><text x="18" y="462" font-size="22" font-weight="700" fill="#101827">为什么这样改</text><text x="18" y="502" font-size="17" fill="#172033">手机上最常做的事只有三件：看稿、批注、交给</text><text x="18" y="532" font-size="17" fill="#172033">AI。这三件事的按钮，都应该在拇指够得到的地</text><text x="18" y="562" font-size="17" fill="#172033">方。顶部只放看的东西，底部只放做的事。</text><rect x="0" y="764" width="393" height="88" fill="#F9F9F9" opacity="0.97"/><line x1="0" y1="764" x2="393" y2="764" stroke="#E5E5EA" stroke-width="1"/><rect x="16" y="774" width="150" height="46" rx="12" fill="#FFFFFF" stroke="#F59A23" stroke-width="1"/><g transform="translate(47.5 790) scale(0.875)" fill="none" stroke="#9A5B00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.8 2.7l2.5 2.5L6 12.5l-3.3.8.8-3.3z"/></g><text x="66.5" y="803.1" font-size="17" font-weight="600" fill="#9A5B00">批注这段</text><rect x="176" y="774" width="201" height="46" rx="12" fill="#0D8077"/><g transform="translate(227.1 790) scale(0.875)" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.6l1.6 4.8 4.8 1.6-4.8 1.6L8 14.4l-1.6-4.8L1.6 8l4.8-1.6z"/></g><text x="246.1" y="803.1" font-size="17" font-weight="600" fill="#FFFFFF">交给 AI · 1</text><rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#000000"/>
