<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="回稿 图标方向:三个概念">
<title>回稿 图标方向:三个概念</title>
<style>text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;text-spacing-trim:space-all}.m{font-family:ui-monospace,"SF Mono",Menlo,monospace}</style>
<defs><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B1220" flood-opacity="0.16"/></filter><filter id="sh2" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1.1" flood-color="#0B1220" flood-opacity="0.14"/></filter></defs>
<rect x="0" y="0" width="1024" height="1024" fill="#F5F6F8"/><defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13A08F"/><stop offset="1" stop-color="#0A5057"/></linearGradient>
<g id="ia"><rect width="300" height="300" rx="66" fill="url(#tg)"/><path d="M100 56H192L244 108V200a44 44 0 0 1-44 44H100a44 44 0 0 1-44-44V100a44 44 0 0 1 44-44z" fill="#FFFFFF"/><path d="M192 56V92a16 16 0 0 0 16 16H244z" fill="#CFD6E2"/><rect x="98" y="98" width="104" height="104" rx="22" fill="#0E7F76"/><rect x="122" y="122" width="56" height="56" rx="12" fill="#FFB21F"/></g>
<g id="ib"><rect width="300" height="300" rx="66" fill="url(#tg)"/><path d="M92 50h116a26 26 0 0 1 26 26v104a26 26 0 0 1-26 26H92a26 26 0 0 1-26-26V76a26 26 0 0 1 26-26z" fill="#FFFFFF"/><rect x="92" y="88" width="104" height="14" rx="7" fill="#C5CCDA"/><rect x="92" y="122" width="72" height="14" rx="7" fill="#C5CCDA"/><rect x="84" y="150" width="132" height="24" rx="10" fill="#FFB21F"/><path d="M226 232 A 92 92 0 0 1 64 214" fill="none" stroke="#FFB21F" stroke-width="22" stroke-linecap="round"/><path d="M38 214 l34 -30 l12 44 z" fill="#FFB21F"/></g>
<g id="ic"><rect width="300" height="300" rx="66" fill="url(#tg)"/><g transform="rotate(-5 150 150)"><path d="M86 56h130a30 30 0 0 1 30 30v104a30 30 0 0 1-30 30h-80l-42 36 6-36h-14a30 30 0 0 1-30-30V86a30 30 0 0 1 30-30z" fill="#FFFFFF"/><rect x="84" y="88" width="92" height="12" rx="6" fill="#C5CCDA"/><rect x="78" y="128" width="140" height="22" rx="8" fill="#FFB21F"/><rect x="84" y="134" width="84" height="11" rx="5.5" fill="#2A3040"/><rect x="84" y="176" width="120" height="12" rx="6" fill="#C5CCDA"/></g><circle cx="226" cy="228" r="46" fill="#FFFFFF"/><path d="M216 206l-16 16 16 16" fill="none" stroke="#0E7F76" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M202 222h26a14 14 0 0 1 0 28h-8" fill="none" stroke="#0E7F76" stroke-width="10" stroke-linecap="round"/></g></defs><text x="56" y="74" font-size="34" font-weight="700" fill="#101827">图标方向：三个概念</text><text x="56" y="106" font-size="15" fill="#697386">都沿用现在的青绿底 + 琥珀高光，只换主体图形；下面一行是 58 像素和 29 像素（主屏幕设置里的大小）。</text><use href="#ia" x="56" y="140"/><text x="56" y="486" font-size="22" font-weight="700" fill="#101827">A  「回」字</text><rect x="186" y="469" width="40" height="24" rx="12" fill="#0D8077"/><text x="206" y="485.7" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">推荐</text><text x="56" y="514" font-size="14" fill="#43526B">两个套在一起的方块就是「回」；外框</text><text x="56" y="536" font-size="14" fill="#43526B">是一张折了角的稿纸，中间琥珀色是你的批注。</text><use href="#ia" transform="translate(56 566) scale(0.19333333333333333)"/><use href="#ia" transform="translate(134 580) scale(0.09666666666666666)"/><rect x="180" y="556" width="176" height="78" rx="12" fill="#1B1D22"/><use href="#ia" transform="translate(192 566) scale(0.19333333333333333)"/><use href="#ia" transform="translate(270 580) scale(0.09666666666666666)"/><use href="#ib" x="376" y="140"/><text x="376" y="486" font-size="22" font-weight="700" fill="#101827">B  稿纸绕回来</text><text x="376" y="514" font-size="14" fill="#43526B">一张有高光的稿纸，底下一道琥珀色</text><text x="376" y="536" font-size="14" fill="#43526B">弧线绕回来，像稿子转了一圈回到手上。</text><use href="#ib" transform="translate(376 566) scale(0.19333333333333333)"/><use href="#ib" transform="translate(454 580) scale(0.09666666666666666)"/><rect x="500" y="556" width="176" height="78" rx="12" fill="#1B1D22"/><use href="#ib" transform="translate(512 566) scale(0.19333333333333333)"/><use href="#ib" transform="translate(590 580) scale(0.09666666666666666)"/><use href="#ic" x="696" y="140"/><text x="696" y="486" font-size="22" font-weight="700" fill="#101827">C  延续现图标</text><text x="696" y="514" font-size="14" fill="#43526B">保留现在的对话气泡稿纸和高光，</text><text x="696" y="536" font-size="14" fill="#43526B">把笔换成一个「回来」的小箭头。</text><use href="#ic" transform="translate(696 566) scale(0.19333333333333333)"/><use href="#ic" transform="translate(774 580) scale(0.09666666666666666)"/><rect x="820" y="556" width="176" height="78" rx="12" fill="#1B1D22"/><use href="#ic" transform="translate(832 566) scale(0.19333333333333333)"/><use href="#ic" transform="translate(910 580) scale(0.09666666666666666)"/><text x="56" y="690" font-size="20" font-weight="700" fill="#101827">29 像素下能不能认出来</text><text x="56" y="726" font-size="15" fill="#43526B">A：能。白框加中间一块琥珀，在一排图标里非常好认；中文用户一眼看出是「回」。</text><text x="56" y="756" font-size="15" fill="#43526B">B：勉强。稿纸能认出，绕回来的弧线在 29 像素只剩一道黄边，意思要靠大图才看得懂。</text><text x="56" y="786" font-size="15" fill="#43526B">C：能认出是老图标，但右下角的小箭头在 29 像素下是一个白点，「回来」的意思传达不出来。</text><text x="56" y="836" font-size="15" font-weight="600" fill="#0A665E">推荐 A：最独特、小尺寸最清楚，而且就是名字本身。定下来以后，再按苹果规范出各尺寸与深色、单色版本。</text>
</svg>
