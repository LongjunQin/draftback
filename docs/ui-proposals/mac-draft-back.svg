<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="回稿 Mac:稿子回来了(回稿卡与显示改动)">
<title>回稿 Mac:稿子回来了(回稿卡与显示改动)</title>
<style>text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;text-spacing-trim:space-all}.m{font-family:ui-monospace,"SF Mono",Menlo,monospace}</style>
<defs><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B1220" flood-opacity="0.16"/></filter><filter id="sh2" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1.1" flood-color="#0B1220" flood-opacity="0.14"/></filter></defs>
<rect x="0" y="0" width="1440" height="900" fill="#F5F6F8"/><rect x="240" y="52" width="880" height="848" fill="#FFFDF8"/><text x="320" y="118" font-size="29" font-weight="750" fill="#101827">跨端规则</text><rect x="452" y="97" width="108.6" height="22" rx="11" fill="#F1F3F6"/><text x="506.3" y="112.3" font-size="12" font-weight="600" fill="#5B6575" text-anchor="middle">总体意见 · 未采纳</text><rect x="320" y="148" width="720" height="44" fill="#F2F9F7"/><rect x="320" y="148" width="3" height="44" fill="#7FC4B9"/><text x="336" y="176" font-size="15" fill="#43526B">人话：用苹果自家的 iCloud 当邮筒，Mac 把文档投进去，手机去取；手机把批注投进去，Mac 去取。</text><text x="320" y="236" font-size="23" font-weight="700" fill="#101827">7. 手机上的状态链</text><text x="320" y="274" font-size="16" fill="#172033">人话：每一步你都能看到批注走到哪了，「已上传」不会被说成「正在改稿」。</text><rect x="320" y="294" width="720" height="170" rx="6" fill="#FFFFFF" stroke="#D4D9E1"/><path d="M326 294.5h708a5.5 5.5 0 0 1 5.5 5.5v28h-719v-28a5.5 5.5 0 0 1 5.5-5.5z" fill="#EEF0F3"/><line x1="320" y1="328" x2="1040" y2="328" stroke="#E3E6EB" stroke-width="1"/><line x1="320" y1="362" x2="1040" y2="362" stroke="#E3E6EB" stroke-width="1"/><line x1="320" y1="396" x2="1040" y2="396" stroke="#E3E6EB" stroke-width="1"/><line x1="320" y1="430" x2="1040" y2="430" stroke="#E3E6EB" stroke-width="1"/><line x1="470" y1="294" x2="470" y2="464" stroke="#E3E6EB" stroke-width="1"/><line x1="800" y1="294" x2="800" y2="464" stroke="#E3E6EB" stroke-width="1"/><text x="332" y="316" font-size="14" font-weight="600" fill="#101827">显示</text><text x="482" y="316" font-size="14" font-weight="600" fill="#101827">含义</text><text x="812" y="316" font-size="14" font-weight="600" fill="#101827">触发</text><text x="332" y="350" font-size="14" fill="#172033">本地已保存</text><text x="482" y="350" font-size="14" fill="#172033">批注在手机里了</text><text x="812" y="350" font-size="14" fill="#172033">每条批注落盘</text><text x="332" y="384" font-size="14" fill="#172033">等待同步</text><text x="482" y="384" font-size="14" fill="#172033">批次已打包，正在上传或等网络</text><text x="812" y="384" font-size="14" fill="#172033">点完成本轮</text><text x="332" y="418" font-size="14" fill="#172033">Mac 已接收</text><text x="482" y="418" font-size="14" fill="#172033">收到 Mac 的回执，批注已进旁注文件</text><text x="812" y="418" font-size="14" fill="#172033">回执到达</text><text x="332" y="452" font-size="14" fill="#172033">修改中</text><text x="482" y="452" font-size="14" fill="#172033">AI 正在改稿</text><text x="812" y="452" font-size="14" fill="#172033">Mac 状态同步</text><rect x="304" y="480" width="3" height="91" rx="1.5" fill="#229453"/><rect x="670.5" y="484.3" width="342.5" height="21.8" rx="3" fill="#CDEFD9"/><rect x="662.5" y="513.3" width="85.6" height="21.8" rx="3" fill="#CDEFD9"/><text x="320" y="500" font-size="16" fill="#172033">状态只能由对应事件推进，界面不得凭猜测前进。例如没收到回执，就不能显示「Mac 已接收」。默</text><text x="320" y="529" font-size="16" fill="#172033">认假设 Mac 常开联网，手机随时可以交出批注；超过 3 分钟没有回执时，显示「等待 Mac 在线」，</text><text x="320" y="558" font-size="16" fill="#172033">并提供「重新发送」。</text><text x="320" y="631" font-size="23" font-weight="700" fill="#101827">8. 三个独立的状态维度</text><text x="320" y="669" font-size="16" fill="#172033">不用一组界面状态替换现有审阅状态机。三个维度各自存、各自显示：</text><text x="324" y="700" font-size="16" fill="#697386">1.</text><text x="346" y="700" font-size="16" fill="#172033">界面模式：阅读或编辑，只影响界面，不影响会话。</text><text x="324" y="729" font-size="16" fill="#697386">2.</text><text x="346" y="729" font-size="16" fill="#172033">审阅生命周期与当前写入者：沿用现有状态机。</text><text x="324" y="758" font-size="16" fill="#697386">3.</text><rect x="648.5" y="742.3" width="115" height="21.8" rx="3" fill="#CDEFD9"/><rect x="304" y="738" width="3" height="26" rx="1.5" fill="#229453"/><text x="346" y="758" font-size="16" fill="#172033">同步状态：按会话记录推送、批次与回执。详见第十二节。</text><text x="320" y="805" font-size="16" fill="#172033">现有的写入检查、版本校验、幂等、备份、原子写入、外部变化检测全部保留。</text><text x="320" y="834" font-size="16" fill="#172033">冻结审阅期间不能直接覆盖被批注版本；要改，只能另存副本。</text><circle cx="1073" cy="494.5" r="10" fill="#229453"/><g transform="translate(1066 487.5) scale(0.875)" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.2 8.4l3 3 6.6-6.8"/></g><circle cx="1073" cy="523.5" r="10" fill="#229453"/><g transform="translate(1066 516.5) scale(0.875)" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.2 8.4l3 3 6.6-6.8"/></g><rect x="0" y="0" width="240" height="900" fill="#ECEEF2"/><line x1="239.5" y1="0" x2="239.5" y2="900" stroke="#E3E6EB" stroke-width="1"/><circle cx="20" cy="26" r="6" fill="#FF5F57"/><circle cx="40" cy="26" r="6" fill="#FEBC2E"/><circle cx="60" cy="26" r="6" fill="#28C840"/><g transform="translate(204 18) scale(1)" fill="none" stroke="#697386" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M6 2.5v11"/></g><rect x="16" y="62" width="208" height="26" rx="7" fill="#E4E7EC"/><rect x="18" y="64" width="102" height="22" rx="5.5" fill="#FFFFFF" filter="url(#sh2)"/><text x="69" y="79.3" font-size="12" font-weight="600" fill="#101827" text-anchor="middle">稿件</text><text x="171" y="79.3" font-size="12" font-weight="500" fill="#697386" text-anchor="middle">大纲</text><g transform="translate(16 866) scale(0.938)" fill="none" stroke="#697386" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.6 12.6h6.9a3 3 0 0 0 .3-6 4 4 0 0 0-7.6.9 2.6 2.6 0 0 0 .4 5.1z"/><path d="M6.4 9.4l1.3 1.3 2.4-2.4"/></g><text x="36" y="878" font-size="11" fill="#697386">iCloud 已同步 · 刚刚</text><text x="16" y="114" font-size="11" font-weight="600" fill="#697386">轮到你</text><text x="224" y="114" font-size="11" font-weight="600" fill="#8D96A6" text-anchor="end">2</text><circle cx="22" cy="138" r="4" fill="#0D8077"/><text x="34" y="142" font-size="13" font-weight="500" fill="#101827">发布说明.md</text><text x="34" y="158" font-size="11" fill="#697386">第 3 轮 · 1 条未交 · 10:52</text><circle cx="22" cy="184" r="4" fill="#0D8077"/><text x="34" y="188" font-size="13" font-weight="500" fill="#101827">改名方案.md</text><text x="34" y="204" font-size="11" fill="#697386">第 1 轮 · 新文档 · 09:30</text><circle cx="222" cy="184" r="4" fill="#0D8077"/><text x="16" y="238" font-size="11" font-weight="600" fill="#697386">AI 在改</text><text x="224" y="238" font-size="11" font-weight="600" fill="#8D96A6" text-anchor="end">1</text><circle cx="22" cy="262" r="4" fill="#6E56CF"/><text x="34" y="266" font-size="13" font-weight="500" fill="#101827">rename-plan.md</text><text x="34" y="282" font-size="11" fill="#697386">AI 正在改稿 · 2 分钟</text><text x="16" y="316" font-size="11" font-weight="600" fill="#697386">回稿了</text><text x="224" y="316" font-size="11" font-weight="600" fill="#8D96A6" text-anchor="end">1</text><rect x="8" y="324" width="224" height="44" rx="7" fill="#E2F3F0"/><circle cx="22" cy="340" r="4" fill="#229453"/><text x="34" y="344" font-size="13" font-weight="600" fill="#0A665E">跨端规则.md</text><text x="34" y="360" font-size="11" fill="#0A665E">第 2 轮回稿 · 采纳 2 · 未采纳 1</text><text x="16" y="394" font-size="11" font-weight="600" fill="#697386">最近打开</text><text x="224" y="394" font-size="11" font-weight="600" fill="#8D96A6" text-anchor="end">2</text><circle cx="22" cy="418" r="4" fill="#8D96A6"/><text x="34" y="422" font-size="13" font-weight="500" fill="#101827">README.md</text><text x="34" y="438" font-size="11" fill="#697386">昨天 · 未开审阅</text><circle cx="22" cy="464" r="4" fill="#8D96A6"/><text x="34" y="468" font-size="13" font-weight="500" fill="#101827">路线图.md</text><text x="34" y="484" font-size="11" fill="#697386">10 月 12 日 · 已定稿</text><rect x="240" y="0" width="1200" height="52" fill="#FAFAFB"/><line x1="240" y1="51.5" x2="1440" y2="51.5" stroke="#E3E6EB" stroke-width="1"/><g transform="translate(258 18) scale(1)" fill="none" stroke="#697386" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 1.8h5.2L12.4 5v9.2H4z"/><path d="M9 1.8V5h3.4"/></g><text x="280" y="31" font-size="13" font-weight="600" fill="#101827">跨端规则.md</text><g transform="translate(356.5 20) scale(0.75)" fill="none" stroke="#8D96A6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6.2L8 9.8l3.5-3.6"/></g><rect x="1356" y="12" width="68" height="28" rx="6" fill="#0D8077"/><g transform="translate(1367.5 19) scale(0.875)" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.2"/><path d="M5.2 8.2l2 2 3.8-4"/></g><text x="1386.5" y="30.7" font-size="13" font-weight="600" fill="#FFFFFF">定稿</text><g transform="translate(1326 18) scale(1)" fill="none" stroke="#697386" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M10 2.5v11"/></g><rect x="1218" y="14" width="92" height="24" rx="7" fill="#E4E7EC"/><rect x="1220" y="16" width="44" height="20" rx="5.5" fill="#FFFFFF" filter="url(#sh2)"/><text x="1242" y="30.3" font-size="12" font-weight="600" fill="#101827" text-anchor="middle">阅读</text><text x="1286" y="30.3" font-size="12" font-weight="500" fill="#697386" text-anchor="middle">编辑</text><g transform="translate(1186 18) scale(1)" fill="none" stroke="#697386" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.8v8.4M5.2 4.4L8 1.8l2.8 2.6"/><path d="M5 7H3.6v7h8.8V7H11"/></g><rect x="1150" y="12" width="28" height="28" rx="6" fill="#E2F3F0"/><g transform="translate(1156 18) scale(1)" fill="none" stroke="#0A665E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.8" y="1.8" width="12.4" height="12.4" rx="2.4"/><path d="M5.4 4.6v4M3.4 6.6h4M8.8 11h3.8"/></g><g transform="translate(1126 18) scale(1)" fill="none" stroke="#697386" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="4.6"/><path d="M10.5 10.5L14 14"/></g><rect x="689.5" y="13" width="221" height="26" rx="13" fill="#E7F6EC" stroke="#229453" stroke-width="1" stroke-opacity="0.38"/><g transform="translate(701.5 19) scale(0.875)" fill="none" stroke="#1F6B3F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.2 3.2L2.8 6.6 6.2 10"/><path d="M3 6.6h6.6a3.6 3.6 0 0 1 0 7.2H7"/></g><text x="721.5" y="30.5" font-size="12.5" font-weight="600" fill="#1F6B3F">第 2 轮回稿 · 采纳 2 · 未采纳 1</text><rect x="1120" y="52" width="320" height="848" fill="#FFFFFF"/><line x1="1120.5" y1="52" x2="1120.5" y2="900" stroke="#E3E6EB" stroke-width="1"/><text x="1140" y="86" font-size="15" font-weight="700" fill="#101827">回稿</text><rect x="1332" y="69" width="92" height="24" rx="7" fill="#E4E7EC"/><rect x="1334" y="71" width="44" height="20" rx="5.5" fill="#FFFFFF" filter="url(#sh2)"/><text x="1356" y="85.3" font-size="12" font-weight="600" fill="#101827" text-anchor="middle">本轮</text><text x="1400" y="85.3" font-size="12" font-weight="500" fill="#697386" text-anchor="middle">历史</text><rect x="1136" y="104" width="288" height="224" rx="12" fill="#E7F6EC" stroke="#229453" stroke-opacity="0.3"/><g transform="translate(1152 120) scale(1.125)" fill="none" stroke="#1F6B3F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.2 3.2L2.8 6.6 6.2 10"/><path d="M3 6.6h6.6a3.6 3.6 0 0 1 0 7.2H7"/></g><text x="1178" y="135" font-size="16" font-weight="700" fill="#1F6B3F">第 2 轮回稿</text><text x="1408" y="135" font-size="11" fill="#697386" text-anchor="end">今天 10:42</text><text x="1152" y="158" font-size="11.5" fill="#697386">AI 用时 4 分钟 · 改了 3 处</text><rect x="1152" y="168" width="48.6" height="22" rx="11" fill="#CDEFD9"/><text x="1176.3" y="183.3" font-size="12" font-weight="600" fill="#1F6B3F" text-anchor="middle">采纳 2</text><rect x="1206.6" y="168" width="60.6" height="22" rx="11" fill="#F1F3F6"/><text x="1236.8" y="183.3" font-size="12" font-weight="600" fill="#5B6575" text-anchor="middle">未采纳 1</text><text x="1152" y="214" font-size="13" fill="#101827">按你的批注补了一个例子，把「长时间」定</text><text x="1152" y="234" font-size="13" fill="#101827">为 3 分钟。第八节和第十二节没有合并：两</text><text x="1152" y="254" font-size="13" fill="#101827">节讲的层面不同，合并会丢技术细节；已在</text><text x="1152" y="274" font-size="13" fill="#101827">第八节末尾加了指向第十二节的一句。</text><rect x="1152" y="296" width="66.3" height="26" rx="6" fill="#FFFFFF" stroke="#D4D9E1" stroke-width="1"/><text x="1185.2" y="313.3" font-size="12" font-weight="600" fill="#172033" text-anchor="middle">‹ 上一处</text><rect x="1228" y="296" width="66.3" height="26" rx="6" fill="#FFFFFF" stroke="#D4D9E1" stroke-width="1"/><text x="1261.2" y="313.3" font-size="12" font-weight="600" fill="#172033" text-anchor="middle">下一处 ›</text><text x="1408" y="314" font-size="11" fill="#1F6B3F" text-anchor="end">改动已标绿</text><text x="1140" y="352" font-size="11" font-weight="600" fill="#697386">逐条结果 · 3</text><rect x="1136" y="364" width="288" height="128" rx="10" fill="#FFFFFF" stroke="#E3E6EB"/><circle cx="1156" cy="386" r="9" fill="#229453"/><g transform="translate(1149.5 379.5) scale(0.813)" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.2 8.4l3 3 6.6-6.8"/></g><rect x="1174" y="378" width="3" height="15" rx="1.5" fill="#F59A23"/><text x="1184" y="390" font-size="12" fill="#43526B">界面不得凭猜测前进</text><text x="1174" y="413" font-size="12.5" fill="#697386">你：加一个例子：什么情况算凭猜测前</text><text x="1174" y="431" font-size="12.5" fill="#697386">进？</text><text x="1174" y="456" font-size="13" font-weight="500" fill="#101827">AI：加了例子——没收到回执，就不能显</text><text x="1174" y="475" font-size="13" fill="#101827">示「Mac 已接收」。</text><rect x="1136" y="502" width="288" height="91" rx="10" fill="#FFFFFF" stroke="#E3E6EB"/><circle cx="1156" cy="524" r="9" fill="#229453"/><g transform="translate(1149.5 517.5) scale(0.813)" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.2 8.4l3 3 6.6-6.8"/></g><rect x="1174" y="516" width="3" height="15" rx="1.5" fill="#F59A23"/><text x="1184" y="528" font-size="12" fill="#43526B">长时间没有回执</text><text x="1174" y="551" font-size="12.5" fill="#697386">你：多久算长时间？写个具体的分钟数。</text><text x="1174" y="576" font-size="13" font-weight="500" fill="#101827">AI：定为 3 分钟。</text><rect x="1136" y="603" width="288" height="147" rx="10" fill="#FFFFFF" stroke="#E3E6EB"/><circle cx="1156" cy="625" r="9" fill="#8D96A6"/><g transform="translate(1149.5 618.5) scale(0.813)" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.2 4.2l7.6 7.6M11.8 4.2l-7.6 7.6"/></g><rect x="1174" y="616" width="58" height="18" rx="9" fill="#FFF4DD"/><text x="1203" y="629" font-size="11" font-weight="600" fill="#9A5B00" text-anchor="middle">总体意见</text><text x="1174" y="652" font-size="12.5" fill="#697386">你：第八节和第十二节有重复，能不能合</text><text x="1174" y="670" font-size="12.5" fill="#697386">并成一节？</text><text x="1174" y="695" font-size="13" font-weight="500" fill="#43526B">未采纳：两节讲的层面不同，合并会丢细</text><text x="1174" y="714" font-size="13" fill="#43526B">节；已在第八节末尾加了指向第十二节的</text><text x="1174" y="733" font-size="13" fill="#43526B">一句。</text><line x1="1120" y1="846" x2="1440" y2="846" stroke="#E3E6EB" stroke-width="1"/><text x="1140" y="870" font-size="11.5" fill="#697386">要继续改：直接在正文划词批注，</text><text x="1140" y="887" font-size="11.5" fill="#697386">自动开始第 3 轮。</text>
</svg>
