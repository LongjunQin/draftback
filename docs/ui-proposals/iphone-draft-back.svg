<svg xmlns="http://www.w3.org/2000/svg" width="393" height="852" viewBox="0 0 393 852" role="img" aria-label="回稿 iPhone:回稿卡与显示改动">
<title>回稿 iPhone:回稿卡与显示改动</title>
<style>text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;text-spacing-trim:space-all}.m{font-family:ui-monospace,"SF Mono",Menlo,monospace}</style>
<defs><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B1220" flood-opacity="0.16"/></filter><filter id="sh2" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1.1" flood-color="#0B1220" flood-opacity="0.14"/></filter></defs>
<rect x="0" y="0" width="393" height="852" fill="#FFFDF8"/><rect x="0" y="0" width="393" height="104" fill="#F9F9F9"/><line x1="0" y1="104" x2="393" y2="104" stroke="#E5E5EA" stroke-width="1"/><g transform="translate(8 66) scale(1.375)" fill="none" stroke="#0D8077" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10.2 2.8L5 8l5.2 5.2"/></g><text x="32" y="83" font-size="17" fill="#0D8077">稿件</text><text x="196.5" y="78" font-size="17" font-weight="600" fill="#000000" text-anchor="middle">跨端规则.md</text><circle cx="158.5" cy="92" r="3.5" fill="#229453"/><text x="200.5" y="96" font-size="12" font-weight="600" fill="#1F6B3F" text-anchor="middle">第 2 轮回稿</text><g transform="translate(322 70) scale(1.25)" fill="none" stroke="#0D8077" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h8M6 8h8M6 12h8M2.5 4h.1M2.5 8h.1M2.5 12h.1"/></g><g transform="translate(358 70) scale(1.25)" fill="none" stroke="#0D8077" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.6"/><path d="M5 8h.1M8 8h.1M11 8h.1"/></g><text x="54" y="37" font-size="17" font-weight="600" fill="#000000" text-anchor="middle">9:41</text><rect x="134" y="11" width="125" height="37" rx="18.5" fill="#000000"/><rect x="296" y="30" width="3" height="3" rx="1" fill="#000000"/><rect x="301" y="27" width="3" height="6" rx="1" fill="#000000"/><rect x="306" y="24" width="3" height="9" rx="1" fill="#000000"/><rect x="311" y="21" width="3" height="12" rx="1" fill="#000000"/><path d="M319 27.5a10 10 0 0 1 13 0M321.6 30.4a6 6 0 0 1 7.8 0" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/><circle cx="325.5" cy="33" r="1.7" fill="#000000"/><rect x="339" y="24" width="25" height="12.5" rx="3.8" fill="none" stroke="#000000" stroke-width="1" stroke-opacity="0.45"/><rect x="341" y="26" width="19" height="8.5" rx="2" fill="#000000"/><rect x="365.5" y="28.2" width="1.6" height="4.2" rx="0.8" fill="#000000" opacity="0.45"/><rect x="14" y="118" width="365" height="218" rx="16" fill="#E7F6EC" stroke="#229453" stroke-opacity="0.3"/><g transform="translate(32 136) scale(1.25)" fill="none" stroke="#1F6B3F" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M6.2 3.2L2.8 6.6 6.2 10"/><path d="M3 6.6h6.6a3.6 3.6 0 0 1 0 7.2H7"/></g><text x="60" y="153" font-size="18" font-weight="700" fill="#1F6B3F">第 2 轮回稿</text><text x="361" y="153" font-size="13" fill="#6D6D72" text-anchor="end">10:42</text><rect x="32" y="170" width="51.4" height="24" rx="12" fill="#CDEFD9"/><text x="57.7" y="186.7" font-size="13" font-weight="600" fill="#1F6B3F" text-anchor="middle">采纳 2</text><rect x="91.4" y="170" width="64.4" height="24" rx="12" fill="#F1F3F6"/><text x="123.7" y="186.7" font-size="13" font-weight="600" fill="#5B6575" text-anchor="middle">未采纳 1</text><text x="32" y="224" font-size="15" fill="#101827">按你的批注补了一个例子，把「长时间」定为 3</text><text x="32" y="246" font-size="15" fill="#101827">分钟。第八节和第十二节没有合并：两节讲的层</text><text x="32" y="268" font-size="15" fill="#101827">面不同，合并会丢细节。</text><rect x="32" y="284" width="51" height="31" rx="15.5" fill="#229453"/><circle cx="67.5" cy="299.5" r="13.5" fill="#FFFFFF"/><text x="92" y="305" font-size="15" fill="#101827">显示改动</text><text x="361" y="305" font-size="15" font-weight="600" fill="#0D8077" text-anchor="end">逐条结果 3 ›</text><text x="18" y="376" font-size="22" font-weight="700" fill="#101827">7. 手机上的状态链</text><rect x="6" y="395" width="3" height="152" rx="1.5" fill="#229453"/><rect x="50.5" y="429.3" width="312.7" height="23.1" rx="3" fill="#CDEFD9"/><rect x="16.5" y="459.3" width="54" height="23.1" rx="3" fill="#CDEFD9"/><rect x="101.5" y="489.3" width="90.7" height="23.1" rx="3" fill="#CDEFD9"/><text x="18" y="416" font-size="17" fill="#172033">状态只能由对应事件推进，界面不得凭猜测前</text><text x="18" y="446" font-size="17" fill="#172033">进。例如没收到回执，就不能显示「Mac 已接</text><text x="18" y="476" font-size="17" fill="#172033">收」。默认假设 Mac 常开联网，手机随时可以</text><text x="18" y="506" font-size="17" fill="#172033">交出批注；超过 3 分钟没有回执时，显示「等</text><text x="18" y="536" font-size="17" fill="#172033">待 Mac 在线」，并提供「重新发送」。</text><text x="18" y="580" font-size="17" fill="#172033">每条批注的处理结果，Mac 端已逐条记录；手</text><text x="18" y="610" font-size="17" fill="#172033">机上点「逐条结果」就能看到。</text><rect x="0" y="764" width="393" height="88" fill="#F9F9F9" opacity="0.97"/><line x1="0" y1="764" x2="393" y2="764" stroke="#E5E5EA" stroke-width="1"/><text x="16" y="794" font-size="15" fill="#6D6D72">划词即开始第 3 轮</text><text x="16" y="812" font-size="12" fill="#8E8E93">有意见就直接批</text><rect x="214" y="774" width="163" height="46" rx="12" fill="#0D8077"/><g transform="translate(269 790) scale(0.875)" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.2"/><path d="M5.2 8.2l2 2 3.8-4"/></g><text x="288" y="803.1" font-size="17" font-weight="600" fill="#FFFFFF">定稿</text><rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#000000"/>
</svg>
