# XcodeGen 工程描述:ios/scripts/sync-web.sh && xcodegen generate
name: MDTurn
options:
  bundleIdPrefix: org.mdturn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # 开发者账户激活后把 Team ID 填到这里,或 xcodebuild DEVELOPMENT_TEAM=XXXX
    DEVELOPMENT_TEAM: ""
targets:
  MDTurn:
    type: application
    platform: iOS
    sources:
      - path: MDTurn/Sources
      - path: MDTurn/Resources
      - path: MDTurn/Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.mdturn.ios
        PRODUCT_NAME: MDTurn
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: MDTurn
    info:
      path: MDTurn/Info.plist
      properties:
        CFBundleDisplayName: MDTurn
        UILaunchScreen: {}
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: false
        UIFileSharingEnabled: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.daringfireball.markdown, public.plain-text]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown]
              public.mime-type: [text/markdown]
