# XcodeGen 工程描述:ios/scripts/sync-web.sh && xcodegen generate
name: MDTurn
options:
  bundleIdPrefix: org.mdturn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # 开发者账户激活后把 Team ID 填到这里,或 xcodebuild DEVELOPMENT_TEAM=XXXX
    DEVELOPMENT_TEAM: ""
    # 主屏幕上的名字。scripts/install-device.sh 装测试版时改成"MDTurn 测试",与将来的正式版区分
    MDTURN_DISPLAY_NAME: MDTurn
targets:
  MDTurn:
    type: application
    platform: iOS
    sources:
      - path: MDTurn/Sources
      - path: MDTurn/Resources
      - path: MDTurn/Assets.xcassets
      - path: MDTurn/Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.mdturn.ios
        PRODUCT_NAME: MDTurn
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: MDTurn/Info.plist
      properties:
        CFBundleDisplayName: $(MDTURN_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # 用自己的 Info.plist 时 INFOPLIST_KEY_* 构建设置不生效,方向必须写在这里
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: false
        UIFileSharingEnabled: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.daringfireball.markdown, public.plain-text]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown]
              public.mime-type: [text/markdown]
