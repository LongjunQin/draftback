# XcodeGen 工程描述:ios/scripts/sync-web.sh && xcodegen generate
name: Draftback
options:
  bundleIdPrefix: app.draftback
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "4"
    CODE_SIGN_STYLE: Automatic
    # 开发者账户激活后把 Team ID 填到这里,或 xcodebuild DEVELOPMENT_TEAM=XXXX
    DEVELOPMENT_TEAM: ""
    # 主屏幕上的名字:英文系统 Draftback,中文系统「回稿」(构建末尾写进 en / zh-Hans 的 InfoPlist.strings)。
    # scripts/install-device.sh 装测试版时改成"Draftback Beta"/"回稿 测试",与正式版区分
    DRAFTBACK_DISPLAY_NAME_EN: Draftback
    DRAFTBACK_DISPLAY_NAME_ZH: 回稿
targets:
  Draftback:
    type: application
    platform: iOS
    # 单元测试(纯逻辑:首页分组、读稿页状态、时间说法):xcodebuild test -scheme Draftback
    scheme:
      testTargets: [DraftbackTests]
    sources:
      - path: Draftback/Sources
      - path: Draftback/Resources
      - path: Draftback/Assets.xcassets
      - path: Draftback/Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.draftback.ios
        PRODUCT_NAME: Draftback
        # 下面的脚本要往 .app 里写本地化文件
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
    # iCloud(CloudKit)同步 + 静默推送(跨端规则第 12 节)。容器 iCloud.app.draftback(2026-10-14 随改名从 iCloud.org.mdturn 换过来,
    # 旧容器闲置;命名沿革见 docs/naming-history.md);App ID 要在开发者网站把这个容器勾上
    entitlements:
      path: Draftback/Draftback.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.app.draftback]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
        # 测试版走 CloudKit Development 环境(与 Mac 辅助程序 Debug 构建同一环境);上架版改 Production
        com.apple.developer.icloud-container-environment: Development
    postBuildScripts:
      - name: 写入本地化的主屏幕名
        basedOnDependencyAnalysis: false
        shell: /bin/bash
        script: |
          set -euo pipefail
          RES="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          write_name() {
            mkdir -p "$RES/$1.lproj"
            printf '"CFBundleDisplayName" = "%s";\n"CFBundleName" = "%s";\n' "$2" "$2" > "$RES/$1.lproj/InfoPlist.strings"
            plutil -convert binary1 "$RES/$1.lproj/InfoPlist.strings"
          }
          write_name en "${DRAFTBACK_DISPLAY_NAME_EN}"
          write_name zh-Hans "${DRAFTBACK_DISPLAY_NAME_ZH}"
    info:
      path: Draftback/Info.plist
      properties:
        CFBundleDisplayName: $(DRAFTBACK_DISPLAY_NAME_EN)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        # 用自己的 Info.plist 时 INFOPLIST_KEY_* 构建设置不生效,方向必须写在这里
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: false
        UIFileSharingEnabled: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.daringfireball.markdown, public.plain-text]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown]
              public.mime-type: [text/markdown]
  DraftbackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DraftbackTests
    dependencies:
      - target: Draftback
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.draftback.ios.tests
