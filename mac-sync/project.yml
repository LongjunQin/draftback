# Draftback Sync:Mac 上负责与 iCloud(CloudKit)打交道的无界面辅助程序(跨端规则第 12 节)。
# 生成工程:mac-sync/scripts/build.sh(xcodegen generate + xcodebuild,自动签名)
name: DraftbackSync
options:
  bundleIdPrefix: app.draftback
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # 构建脚本用 xcodebuild DEVELOPMENT_TEAM=XXXX 传入
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
targets:
  DraftbackSync:
    type: application
    platform: macOS
    sources:
      - path: Sources
    entitlements:
      path: DraftbackSync.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.app.draftback]
        com.apple.developer.icloud-services: [CloudKit]
        # 开发签名默认落到 Production 环境会被拒(Invalid bundle ID for container);
        # Debug 固定 Development,Release 由 build.sh 用 CODE_SIGN_ENTITLEMENTS 换成 Release.entitlements
        com.apple.developer.icloud-container-environment: Development
        # Mac 开发构建还要这条 Development 容器列表,否则 CloudKit 报 Invalid bundle ID for container
        com.apple.developer.icloud-container-development-container-identifiers: [iCloud.app.draftback]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.draftback.mac.sync
        PRODUCT_NAME: Draftback Sync
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Draftback Sync
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: "13.0"
