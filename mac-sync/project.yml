# MDTurn Sync:Mac 上负责与 iCloud(CloudKit)打交道的无界面辅助程序(跨端规则第 12 节)。
# 生成工程:mac-sync/scripts/build.sh(xcodegen generate + xcodebuild,自动签名)
name: MDTurnSync
options:
  bundleIdPrefix: org.mdturn
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # 构建脚本用 xcodebuild DEVELOPMENT_TEAM=XXXX 传入
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
targets:
  MDTurnSync:
    type: application
    platform: macOS
    sources:
      - path: Sources
    entitlements:
      path: MDTurnSync.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.org.mdturn]
        com.apple.developer.icloud-services: [CloudKit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.mdturn.desktop.sync
        PRODUCT_NAME: MDTurn Sync
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: MDTurn Sync
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: "13.0"
