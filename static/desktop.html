<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <!-- 内容安全策略:文档里夹带的脚本一律不执行;脚本只能来自本机服务自带的静态文件。
       服务端对 /desktop 也下发同一份策略(server.js),两处保持一致。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; connect-src 'self'; media-src 'self' data: blob:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>回稿</title>
  <link rel="stylesheet" href="/static/vendor/highlight-github.min.css">
  <link rel="stylesheet" href="/static/vendor/katex.min.css">
  <link rel="stylesheet" href="/static/vendor/phosphor.css">
  <link rel="stylesheet" href="/static/vendor/draftback-editor.css?v=8">
  <link rel="stylesheet" href="/static/desktop.css?v=18">
</head>
<body>
  <div id="appShell" class="app-shell">
    <header class="titlebar drag-region">
      <div class="brand drag-region" aria-label="回稿">
        <span class="brand-mark"><img src="/static/brand/icon-256.png" alt="" aria-hidden="true"></span>
        <span class="brand-name">回稿</span>
      </div>
      <div id="tabList" class="tab-list" role="tablist" aria-label="打开的 Markdown 文档"></div>
      <button id="openTabButton" class="icon-button" type="button" title="打开 Markdown" aria-label="打开 Markdown">
        <i class="ph ph-plus" aria-hidden="true"></i>
      </button>
      <div class="title-actions">
        <button id="toggleLeftTop" class="icon-button" type="button" title="显示或收起左栏" aria-label="显示或收起左栏">
          <i class="ph ph-sidebar-simple" aria-hidden="true"></i>
        </button>
        <button id="toggleRightTop" class="icon-button" type="button" title="显示或收起批注" aria-label="显示或收起批注">
          <i class="ph ph-notepad" aria-hidden="true"></i>
        </button>
      </div>
    </header>

    <aside id="leftSidebar" class="left-sidebar" aria-label="文档导航">
      <div class="side-switch-row">
        <button id="collapseLeft" class="icon-button compact" type="button" title="收起左栏" aria-label="收起左栏">
          <i class="ph ph-caret-double-left" aria-hidden="true"></i>
        </button>
        <div class="segmented" role="tablist" aria-label="左栏内容">
          <button id="outlineModeButton" class="active" type="button" role="tab" aria-selected="true">大纲</button>
          <button id="filesModeButton" type="button" role="tab" aria-selected="false">文件</button>
        </div>
      </div>
      <nav id="outlinePanel" class="outline-panel" aria-label="文章大纲"></nav>
      <section id="filesPanel" class="files-panel" hidden>
        <button id="openFileButton" class="open-file-button" type="button">
          <i class="ph ph-folder-open" aria-hidden="true"></i>
          <span>打开 Markdown 文档</span>
          <kbd>⌘O</kbd>
        </button>
        <button id="newFileButton" class="open-file-button" type="button">
          <i class="ph ph-file-plus" aria-hidden="true"></i>
          <span>新建 Markdown 文档</span>
          <kbd>⌘N</kbd>
        </button>
        <div class="section-label">最近文件</div>
        <div id="recentList" class="recent-list"></div>
      </section>
      <button id="expandLeft" class="collapsed-rail-button" type="button" title="展开左栏" aria-label="展开左栏">
        <i class="ph ph-caret-double-right" aria-hidden="true"></i>
      </button>
    </aside>

    <section id="workspace" class="workspace">
      <div id="documentToolbar" class="document-toolbar" hidden>
        <div class="toolbar-group" role="group" aria-label="阅读或编辑">
          <button id="readingModeButton" class="mode-button active" type="button">
            <i class="ph ph-book-open-text" aria-hidden="true"></i>阅读与批注
          </button>
          <button id="editingModeButton" class="mode-button" type="button">
            <i class="ph ph-pencil-simple-line" aria-hidden="true"></i>编辑
          </button>
        </div>
        <span class="toolbar-spacer"></span>
        <div class="review-state-wrap">
          <button id="reviewStatePill" class="review-state" data-status="reviewing" type="button"
            role="status" aria-live="polite" aria-atomic="true" aria-haspopup="dialog" aria-expanded="false" title="点开看轮次时间线">
            <i id="reviewStateIcon" class="ph ph-lock-key" aria-hidden="true"></i>
            <span id="reviewStateText">批注中 · 0 条</span>
          </button>
          <div id="timelinePopover" class="popover-menu timeline-popover" role="dialog" aria-label="轮次时间线" hidden></div>
        </div>
        <span class="toolbar-spacer"></span>
        <div id="findBar" class="find-bar" role="search" hidden>
          <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
          <input id="findInput" type="search" placeholder="在正文中查找" aria-label="在正文中查找" autocomplete="off" spellcheck="false">
          <span id="findCount" class="find-count">0 / 0</span>
          <button id="findPrev" class="icon-button compact" type="button" title="上一个(⇧↩)" aria-label="上一个"><i class="ph ph-caret-up" aria-hidden="true"></i></button>
          <button id="findNext" class="icon-button compact" type="button" title="下一个(↩)" aria-label="下一个"><i class="ph ph-caret-down" aria-hidden="true"></i></button>
          <button id="findClose" class="icon-button compact" type="button" title="关闭(Esc)" aria-label="关闭查找"><i class="ph ph-x" aria-hidden="true"></i></button>
        </div>
        <button id="findButton" class="icon-button compact" type="button" title="查找(⌘F)" aria-label="查找"><i class="ph ph-magnifying-glass" aria-hidden="true"></i></button>
        <div id="dropOverlay" class="drop-overlay" hidden><div class="drop-card"><i class="ph ph-file-arrow-down" aria-hidden="true"></i>松开即打开 Markdown</div></div>
        <div class="export-menu-wrap">
          <button id="exportMenuButton" class="mode-button" type="button" aria-haspopup="menu" aria-expanded="false" title="导出或打印当前文档">
            <i class="ph ph-export" aria-hidden="true"></i>导出<i class="ph ph-caret-down menu-caret" aria-hidden="true"></i>
          </button>
          <div id="exportMenu" class="popover-menu" role="menu" aria-label="导出" hidden>
            <button type="button" role="menuitem" data-command="export-pdf"><span>导出为 PDF…</span><kbd>⇧⌘E</kbd></button>
            <button type="button" role="menuitem" data-command="export-html"><span>导出为 HTML…</span><small>单文件,可直接发送</small></button>
            <button type="button" role="menuitem" data-command="export-docx"><span>导出为 Word…</span><small>需要 pandoc</small></button>
            <div class="popover-sep" role="separator"></div>
            <button type="button" role="menuitem" data-command="print"><span>打印…</span><kbd>⌘P</kbd></button>
          </div>
        </div>
        <button id="secondaryAction" class="secondary-button action-button" type="button" hidden></button>
        <button id="primaryAction" class="primary-button action-button" type="button" hidden></button>
      </div>
      <main id="readerPane" class="reader-pane">
        <div id="welcome" class="welcome">
          <div class="welcome-mark"><img src="/static/brand/icon-256.png" alt="" aria-hidden="true"></div>
          <h1>打开一篇 Markdown</h1>
          <p>打开即读、可直接编辑。划词写下第一条批注,原文就锁定并开始第 1 轮审阅;批完点「交给 AI」。</p>
          <div class="welcome-actions">
            <button id="welcomeOpenButton" class="primary-button large" type="button">
              <i class="ph ph-folder-open" aria-hidden="true"></i>打开 Markdown
            </button>
            <button id="welcomeNewButton" class="secondary-button large" type="button">
              <i class="ph ph-file-plus" aria-hidden="true"></i>新建 Markdown
            </button>
          </div>
          <div id="welcomeRecent" class="welcome-recent"></div>
        </div>
        <div id="readerScroll" class="reader-scroll" hidden>
          <article id="documentContent" class="markdown-body"></article>
        </div>
        <div id="annotationOverlay" class="annotation-overlay" role="group" aria-label="正文批注标记"></div>
        <!-- 独立只读对比视图:盖在正文上,关掉回到纯完成稿;不往批注用的正文里插删除线 -->
        <section id="compareView" class="compare-view" aria-label="对比视图" hidden>
          <header class="compare-bar">
            <div class="compare-title">
              <i class="ph ph-git-diff" aria-hidden="true"></i>
              <strong id="compareTitle">改动</strong>
              <span id="compareMeta" class="compare-meta"></span>
            </div>
            <div class="compare-nav">
              <span id="comparePosition" class="compare-position"></span>
              <button id="comparePrev" class="icon-button compact" type="button" title="上一处改动(⌥⌘←)" aria-label="上一处改动"><i class="ph ph-caret-up" aria-hidden="true"></i></button>
              <button id="compareNext" class="icon-button compact" type="button" title="下一处改动(⌥⌘→)" aria-label="下一处改动"><i class="ph ph-caret-down" aria-hidden="true"></i></button>
              <button id="compareClose" class="secondary-button compact-button" type="button" title="关闭对比视图,回到完成稿(⇧⌘D 或 Esc)"><i class="ph ph-x" aria-hidden="true"></i>关闭</button>
            </div>
          </header>
          <p id="compareNote" class="compare-note" hidden></p>
          <div id="compareScroll" class="compare-scroll">
            <div class="compare-legend"><span class="legend-insert">新增</span><span class="legend-delete">删除</span><span class="legend-replace">替换</span><span class="legend-hint">只读 · 要继续批注请关闭视图</span></div>
            <article id="compareContent" class="markdown-body compare-body"></article>
          </div>
        </section>
      </main>

      <section id="editorPane" class="editor-pane" hidden aria-label="Markdown 编辑器">
        <div class="editor-toolbar">
          <div>
            <strong>编辑文档</strong>
            <span id="editorSaveState" class="save-state">所有更改均已保存</span>
          </div>
          <div class="editor-actions">
            <button id="saveButton" class="secondary-button" type="button">
              <i class="ph ph-floppy-disk" aria-hidden="true"></i>保存
              <kbd>⌘S</kbd>
            </button>
            <button id="finishManualButton" class="primary-button" type="button" hidden>提交修改</button>
          </div>
        </div>
        <div class="editor-scroll">
          <div id="codeEditor" class="code-editor"></div>
        </div>
      </section>
    </section>

    <aside id="rightSidebar" class="right-sidebar" aria-label="批注列表">
      <div class="notes-header">
        <div>
          <strong>批注</strong>
          <span id="notesTotal" class="notes-total">0</span>
        </div>
        <button id="collapseRight" class="icon-button compact" type="button" title="收起批注栏" aria-label="收起批注栏">
          <i class="ph ph-caret-double-right" aria-hidden="true"></i>
        </button>
      </div>
      <div id="notesContent" class="notes-content">
        <section id="returnCard" class="return-card" aria-label="回稿卡" hidden></section>
        <button id="docNoteButton" class="doc-note-button" type="button" hidden>
          <i class="ph ph-note-pencil" aria-hidden="true"></i>写总体意见
          <span class="hint">针对全篇 · 不锚定文字</span>
        </button>
        <section>
          <div class="notes-section-heading">
            <span><span class="status-dot open"></span>本轮未处理</span>
            <span id="openNotesCount">0</span>
          </div>
          <div id="openNotesList" class="notes-list"></div>
        </section>
        <details id="historySection" class="history-section">
          <summary>
            <span>历史</span>
            <span id="historyNotesCount">0</span>
          </summary>
          <div id="historyNotesList" class="notes-list history-list"></div>
        </details>
      </div>
      <button id="expandRight" class="collapsed-rail-button" type="button" title="展开批注栏" aria-label="展开批注栏">
        <i class="ph ph-caret-double-left" aria-hidden="true"></i>
      </button>
    </aside>
  </div>

  <button id="annotateButton" class="annotate-button" type="button" hidden>
    <i class="ph ph-chat-circle-dots" aria-hidden="true"></i>批注
  </button>

  <div id="annotationDialog" class="modal-backdrop" hidden>
    <section id="annotationDialogPanel" class="annotation-dialog" role="dialog" aria-modal="true"
      aria-labelledby="annotationDialogTitle">
      <header id="annotationDialogDragHandle" class="annotation-dialog-header" data-drag-handle>
        <div>
          <div class="dialog-kicker">本轮批注</div>
          <h2 id="annotationDialogTitle">添加批注</h2>
        </div>
        <button id="closeAnnotationDialog" class="icon-button dialog-close" type="button" aria-label="关闭">
          <i class="ph ph-x" aria-hidden="true"></i>
        </button>
      </header>
      <blockquote id="annotationQuote"></blockquote>
      <label for="annotationText">你的意见</label>
      <textarea id="annotationText" rows="6" placeholder="这段内容哪里需要修改？希望补充什么？"></textarea>
      <footer>
        <button id="cancelAnnotation" class="secondary-button" type="button">取消</button>
        <button id="saveAnnotation" class="primary-button" type="button">保存批注</button>
      </footer>
    </section>
  </div>

  <div id="confirmDialog" class="modal-backdrop" hidden>
    <section class="confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle">
      <div class="confirm-icon"><i class="ph ph-check-circle" aria-hidden="true"></i></div>
      <h2 id="confirmTitle">确认操作</h2>
      <p id="confirmMessage"></p>
      <footer>
        <button id="confirmCancel" class="secondary-button" type="button">取消</button>
        <button id="confirmAccept" class="primary-button" type="button">确认</button>
      </footer>
    </section>
  </div>

  <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>

  <script src="/static/vendor/markdown-it.min.js"></script>
  <script src="/static/vendor/katex.min.js"></script>
  <script src="/static/vendor/texmath.min.js"></script>
  <script src="/static/vendor/highlight.min.js"></script>
  <script src="/static/vendor/mermaid.min.js"></script>
  <script src="/static/vendor/dompurify.min.js"></script>
  <script src="/static/vendor/diff-match-patch.js"></script>
  <script src="/static/vendor/draftback-editor.js?v=8"></script>
  <script src="/static/markdown-patch.js?v=2"></script>
  <script src="/static/desktop-anchor.js?v=5"></script>
  <script src="/static/desktop-handoff.js?v=1"></script>
  <script src="/static/desktop-diff.js?v=1"></script>
  <script src="/static/desktop-history.js?v=1"></script>
  <script src="/static/desktop-compare.js?v=1"></script>
  <script src="/static/desktop.js?v=29"></script>
</body>
</html>
