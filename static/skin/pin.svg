<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <!-- 图钉(方案 C):从正上方看的塑料钉帽 + 落在纸上的投影;钉在卡片顶边正中。灰色的用 CSS filter 去色 -->
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"/></filter>
    <radialGradient id="cap" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#ff9a8a"/>
      <stop offset=".45" stop-color="#d9402f"/>
      <stop offset="1" stop-color="#8e1e14"/>
    </radialGradient>
    <radialGradient id="top" cx="40%" cy="35%" r="60%">
      <stop offset="0" stop-color="#ffb3a6"/>
      <stop offset=".6" stop-color="#e2523f"/>
      <stop offset="1" stop-color="#b22c1f"/>
    </radialGradient>
  </defs>
  <ellipse cx="16.5" cy="17.5" rx="7" ry="6" fill="rgba(40,25,10,.4)" filter="url(#blur)"/>
  <circle cx="13" cy="13" r="8" fill="url(#cap)"/>
  <circle cx="13" cy="13" r="8" fill="none" stroke="rgba(90,20,10,.45)" stroke-width=".8"/>
  <circle cx="12.6" cy="12.6" r="4.6" fill="url(#top)"/>
  <circle cx="12.6" cy="12.6" r="4.6" fill="none" stroke="rgba(120,25,15,.35)" stroke-width=".6"/>
  <ellipse cx="10.6" cy="9.9" rx="2.1" ry="1.3" transform="rotate(-35 10.6 9.9)" fill="#fff" opacity=".85"/>
</svg>
