<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <!-- 纸面大块的轻微深浅不匀 -->
  <filter id="f" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.005" numOctaves="3" seed="2" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 .52  0 0 0 0 .42  0 0 0 0 .27  .16 0 0 0 -.07"/>
  </filter>
  <rect width="600" height="600" filter="url(#f)"/>
</svg>
