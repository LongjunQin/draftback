<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <!-- 软皮细颗粒:灰度光照图,中灰为平面;用 soft-light 叠在皮色上 -->
  <filter id="l" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.62" numOctaves="2" seed="5" stitchTiles="stitch" result="n"/>
    <feDiffuseLighting in="n" surfaceScale="1" diffuseConstant="1" lighting-color="#ffffff" result="lit">
      <feDistantLight azimuth="235" elevation="60"/>
    </feDiffuseLighting>
    <feComponentTransfer in="lit">
      <feFuncR type="linear" slope=".62" intercept="-.037"/>
      <feFuncG type="linear" slope=".62" intercept="-.037"/>
      <feFuncB type="linear" slope=".62" intercept="-.037"/>
    </feComponentTransfer>
  </filter>
  <rect width="360" height="360" filter="url(#l)"/>
</svg>
